<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Science Learning Lab</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f8fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#fff;border:1px solid #e1e6ef;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #00000008}.hero h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.topic{padding:10px 12px;border:1px solid #e1e6ef;border-radius:10px;background:#fafbfd}.muted{color:#667085}.formula{font-family:ui-monospace,monospace;background:#f2f4f7;padding:10px;border-radius:8px;overflow:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px;text-align:left}select,input,button{padding:10px;border-radius:8px;border:1px solid #ccd3df}button{cursor:pointer;font-weight:600}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;margin:3px}.ok{font-weight:700}.step{margin:8px 0;padding:10px;border-left:4px solid #667eea;background:#f8f9ff}
</style>
</head>
<body><div class="wrap">
<section class="hero"><h1>DATA SCIENCE LEARNING LAB</h1><p class="muted">Learn → Mathematics → Dataset → Software Analysis → Research Case → Reporting → Practice</p>
<label>Choose class: <select id="classSelect"></select></label></section>
<section class="card"><h2 id="title"></h2><p id="phase" class="muted"></p><h3>What to Study</h3><div id="topics" class="grid"></div></section>
<section class="card"><h3>What to Do With the Dataset</h3><div id="workflow"></div></section>
<section class="card"><h3>Mathematical Calculation Lab</h3><div id="math"></div></section>
<section class="card"><h3>Research Reporting</h3><div id="report"></div></section>
<section class="card"><h3>Practice Task</h3><div id="practice"></div></section>
</div>
<script>
const phases=[
['Research & Data Fundamentals',1,10],['Excel for Research & Data Analysis',11,30],['R for Statistics & Research',31,55],['Python for Data Science',56,75],['SQL for Data Analysis',76,90],['SPSS for Academic Research',91,105],['Additional Research Software',106,115],['Visualization & Business Intelligence',116,120],['Advanced Statistics & Research Analysis',121,130],['SEM, Machine Learning & Research Projects',131,140]];
const topics=['Research fundamentals','Research questions and objectives','Hypothesis and variables','Measurement scales','Population and sample','Sampling methods','Data types and sources','Questionnaire and scale design','Data collection and ethics','Research data workflow','Excel fundamentals','Data entry and validation','Formulas and references','Logical functions','Text and cleaning functions','Date and time functions','Lookup functions','Conditional aggregation','Sorting and filtering','Tables and structured references','Pivot Tables','Pivot Charts','Descriptive statistics','Correlation in Excel','Regression in Excel','ANOVA in Excel','Research reporting in Excel','Data-cleaning project','Analysis project','Research dashboard','R and RStudio','Objects and vectors','Matrices and lists','Data frames and factors','Functions and packages','Import and export','Base R cleaning','dplyr','tidyr','ggplot2','Descriptive statistics','Probability','Probability distributions','Sampling and estimation','Hypothesis testing','Correlation','Regression','ANOVA','Non-parametric tests','Multivariate analysis','Model diagnostics','Reproducible research','R Markdown','Research visualization','Complete R project'];
const special={1:['What is research?','Purpose and importance of research','Types of research','Research process / research cycle','Research problem identification','Research questions','Research objectives','Hypothesis','Variables and variable types','Population and sample','Primary vs secondary data','Quantitative vs qualitative research','Exploratory, descriptive and analytical research','Basic research ethics','Research design basics','Data collection methods','Sampling basics','Reliability and validity — introduction','Research dataset structure','Basic research reporting'],2:['Research questions and objectives','Hypothesis and variables','Measurement scales','Population and sample','Sampling methods','Data types and sources','Research data workflow']};
function phaseOf(n){return phases.find(p=>n>=p[1]&&n<=p[2])}
function classTitle(n){let p=phaseOf(n);let idx=n-p[1];let arr=p[0]==='Research & Data Fundamentals'?special[1]:p[0]==='Excel for Research & Data Analysis'?topics.slice(10,30):p[0]==='R for Statistics & Research'?topics.slice(30,55):[];return arr[idx]||`${p[0]} — Class ${n}`}
function csv(n){let rows=[];rows.push(['id','group','age','score','exposure','outcome']);for(let i=1;i<=30;i++){let g=i%3===0?'C':i%2===0?'B':'A';let age=18+(i*7+n)%43;let exposure=((i*11+n)%91)+5;let score=40+((i*13+n*3)%61);let outcome=score>=60?1:0;rows.push([i,g,age,score,exposure,outcome])}return rows}
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length}function med(a){a=[...a].sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function sd(a){let m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))}function corr(x,y){let mx=mean(x),my=mean(y);let num=x.reduce((s,v,i)=>s+(v-mx)*(y[i]-my),0);let dx=Math.sqrt(x.reduce((s,v)=>s+(v-mx)**2,0)),dy=Math.sqrt(y.reduce((s,v)=>s+(v-my)**2,0));return num/(dx*dy)}
function render(n){let p=phaseOf(n), t=special[n]||[classTitle(n),'Key concepts and definitions','When to use the method','Assumptions / conditions','Mathematical logic','Dataset variables and coding','Software workflow','Output interpretation','Research reporting'];document.getElementById('title').textContent=`Class ${String(n).padStart(2,'0')}: ${classTitle(n)}`;document.getElementById('phase').textContent=p[0]+` • Classes ${p[1]}–${p[2]}`;document.getElementById('topics').innerHTML=t.map((x,i)=>`<div class="topic"><b>${i+1}.</b> ${x}</div>`).join('');document.getElementById('workflow').innerHTML=['Download/use the class CSV dataset.','Identify every variable, type, unit and coding.','Clean/check missing values and impossible values.','Perform the class-relevant calculation or analysis.','Repeat the same analysis in the relevant software.','Compare manual and software results.','Interpret the statistical output in research language.','Write a short Results paragraph and conclusion.'].map((x,i)=>`<div class="step"><b>${i+1}.</b> ${x}</div>`).join('');
let r=csv(n), score=r.slice(1).map(x=>x[3]), exp=r.slice(1).map(x=>x[4]);let m=mean(score),variance=score.reduce((s,x)=>s+(x-m)**2,0)/(score.length-1),s=sd(score),c=corr(exp,score);document.getElementById('math').innerHTML=`<p><b>Dataset:</b> 30 observations • score, exposure, age, group, outcome</p><p class="formula">Mean = Σx / n = ${score.reduce((a,b)=>a+b,0)} / ${score.length} = ${m.toFixed(4)}</p><p class="formula">Sample variance = Σ(x − x̄)² / (n − 1) = ${variance.toFixed(4)}</p><p class="formula">Sample SD = √variance = ${s.toFixed(4)}</p><p class="formula">Median(score) = ${med(score).toFixed(2)}</p><p class="formula">Pearson r(exposure, score) = ${c.toFixed(4)}</p><p><b>Interpretation:</b> The values above are calculated directly from the generated class dataset. Use them to verify your Excel/R/Python/SPSS output rather than blindly accepting software output.</p><details><summary>Show first 10 rows</summary><table><tr>${r[0].map(x=>`<th>${x}</th>`).join('')}</tr>${r.slice(1,11).map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></details>`;
document.getElementById('report').innerHTML=`<p><b>Results:</b> Report n = ${score.length}, mean score = ${m.toFixed(2)}, SD = ${s.toFixed(2)}, median = ${med(score).toFixed(2)}. For correlation, report r = ${c.toFixed(3)} and explain direction/strength in context.</p><p><b>Rule:</b> Do not only paste a table. State the research question, method, result, statistical decision where applicable, and substantive interpretation.</p>`;document.getElementById('practice').innerHTML=`<ol><li>Recalculate the mean and SD manually.</li><li>Verify the results in Excel/R/Python/SPSS according to this phase.</li><li>Choose one research question that can be answered with this dataset.</li><li>Write a 100–150 word Results + Interpretation section.</li><li>Before the exam, explain why the selected method is appropriate.</li></ol>`}
const sel=document.getElementById('classSelect');for(let i=1;i<=140;i++){let o=document.createElement('option');o.value=i;o.textContent=`Class ${String(i).padStart(2,'0')} — ${classTitle(i)}`;sel.appendChild(o)}sel.onchange=()=>render(+sel.value);render(1);
</script></body></html>
