<script>window.DISTRIBUTIONS=[{"name": "Bernoulli", "type": "Discrete", "params": "p", "mean": "p", "variance": "p(1-p)", "key": "p"}, {"name": "Binomial", "type": "Discrete", "params": "n,p", "mean": "n*p", "variance": "n*p*(1-p)", "key": "binomial"}, {"name": "Geometric", "type": "Discrete", "params": "p", "mean": "1/p", "variance": "(1-p)/(p*p)", "key": "geometric"}, {"name": "Negative Binomial", "type": "Discrete", "params": "r,p", "mean": "r*(1-p)/p", "variance": "r*(1-p)/(p*p)", "key": "negbin"}, {"name": "Hypergeometric", "type": "Discrete", "params": "N,K,n", "mean": "n*K/N", "variance": "n*(K/N)*(1-K/N)*(N-n)/(N-1)", "key": "hyper"}, {"name": "Poisson", "type": "Discrete", "params": "lambda", "mean": "lambda", "variance": "lambda", "key": "poisson"}, {"name": "Discrete Uniform", "type": "Discrete", "params": "a,b", "mean": "(a+b)/2", "variance": "((b-a+1)^2-1)/12", "key": "duniform"}, {"name": "Categorical", "type": "Discrete", "params": "p1,p2,p3", "mean": "weighted", "variance": "weighted", "key": "categorical"}, {"name": "Multinomial", "type": "Discrete", "params": "n,p1,p2,p3", "mean": "n*pi", "variance": "n*pi*(1-pi)", "key": "multinomial"}, {"name": "Zipf", "type": "Discrete", "params": "s", "mean": "zeta-based", "variance": "zeta-based", "key": "zipf"}, {"name": "Logarithmic", "type": "Discrete", "params": "p", "mean": "-p/((1-p)*ln(1-p))", "variance": "numerical", "key": "logarithmic"}, {"name": "Skellam", "type": "Discrete", "params": "mu1,mu2", "mean": "mu1-mu2", "variance": "mu1+mu2", "key": "skellam"}, {"name": "Discrete Laplace", "type": "Discrete", "params": "p", "mean": "0", "variance": "2*p/(1-p)^2", "key": "dlaplace"}, {"name": "Beta-Binomial", "type": "Discrete", "params": "n,alpha,beta", "mean": "n*alpha/(alpha+beta)", "variance": "n*a*b*(a+b+n)/((a+b)^2*(a+b+1))", "key": "betabin"}, {"name": "Dirichlet-Multinomial", "type": "Discrete", "params": "n,a1,a2,a3", "mean": "n*ai/A", "variance": "n*ai/A*(1-ai/A)*(A+n)/(A+1)", "key": "dirichletmulti"}, {"name": "Borel", "type": "Discrete", "params": "lambda", "mean": "1/(1-lambda)", "variance": "lambda/(1-lambda)^3", "key": "borel"}, {"name": "Yule-Simon", "type": "Discrete", "params": "rho", "mean": "rho/(rho-1)", "variance": "rho^2/((rho-1)^2*(rho-2))", "key": "yulesimon"}, {"name": "Benford", "type": "Discrete", "params": "base", "mean": "1", "variance": "variance depends on base", "key": "benford"}, {"name": "Bivariate Poisson", "type": "Discrete", "params": "l1,l2,l3", "mean": "l1+l3,l2+l3", "variance": "l1+l3,l2+l3", "key": "bipoisson"}, {"name": "Chinese Restaurant Process", "type": "Discrete", "params": "alpha,n", "mean": "expected clusters", "variance": "variance depends on alpha", "key": "crp"}, {"name": "Uniform", "type": "Continuous", "params": "a,b", "mean": "(a+b)/2", "variance": "(b-a)^2/12", "key": "uniform"}, {"name": "Normal", "type": "Continuous", "params": "mu,sigma", "mean": "mu", "variance": "sigma^2", "key": "normal"}, {"name": "Exponential", "type": "Continuous", "params": "lambda", "mean": "1/lambda", "variance": "1/lambda^2", "key": "exponential"}, {"name": "Gamma", "type": "Continuous", "params": "shape,scale", "mean": "shape*scale", "variance": "shape*scale^2", "key": "gamma"}, {"name": "Beta", "type": "Continuous", "params": "alpha,beta", "mean": "alpha/(alpha+beta)", "variance": "a*b/((a+b)^2*(a+b+1))", "key": "beta"}, {"name": "Weibull", "type": "Continuous", "params": "shape,scale", "mean": "scale*Gamma(1+1/shape)", "variance": "scale^2*(Gamma(1+2/k)-Gamma(1+1/k)^2)", "key": "weibull"}, {"name": "Lognormal", "type": "Continuous", "params": "mu,sigma", "mean": "exp(mu+sigma^2/2)", "variance": "(exp(sigma^2)-1)*exp(2mu+sigma^2)", "key": "lognormal"}, {"name": "Cauchy", "type": "Continuous", "params": "x0,gamma", "mean": "undefined", "variance": "undefined", "key": "cauchy"}, {"name": "Student's t", "type": "Continuous", "params": "df", "mean": "0 (df>1)", "variance": "df/(df-2) (df>2)", "key": "t"}, {"name": "F", "type": "Continuous", "params": "df1,df2", "mean": "df2/(df2-2)", "variance": "formula", "key": "f"}, {"name": "Chi-Square", "type": "Continuous", "params": "df", "mean": "df", "variance": "2*df", "key": "chisq"}, {"name": "Logistic", "type": "Continuous", "params": "mu,s", "mean": "mu", "variance": "pi^2*s^2/3", "key": "logistic"}, {"name": "Laplace", "type": "Continuous", "params": "mu,b", "mean": "mu", "variance": "2*b^2", "key": "laplace"}, {"name": "Pareto", "type": "Continuous", "params": "xm,alpha", "mean": "alpha*xm/(alpha-1)", "variance": "alpha*xm^2/((alpha-1)^2*(alpha-2))", "key": "pareto"}, {"name": "Rayleigh", "type": "Continuous", "params": "sigma", "mean": "sigma*sqrt(pi/2)", "variance": "(4-pi)*sigma^2/2", "key": "rayleigh"}, {"name": "Gumbel", "type": "Continuous", "params": "mu,beta", "mean": "mu+gamma*beta", "variance": "pi^2*beta^2/6", "key": "gumbel"}, {"name": "Triangular", "type": "Continuous", "params": "a,m,b", "mean": "(a+m+b)/3", "variance": "(a^2+m^2+b^2-a*m-a*b-m*b)/18", "key": "triangular"}, {"name": "Erlang", "type": "Continuous", "params": "k,lambda", "mean": "k/lambda", "variance": "k/lambda^2", "key": "erlang"}, {"name": "Inverse Gaussian", "type": "Continuous", "params": "mu,lambda", "mean": "mu", "variance": "mu^3/lambda", "key": "invgauss"}, {"name": "Fisher's z", "type": "Continuous", "params": "n/a", "mean": "depends on df", "variance": "depends on df", "key": "fisherz"}];</script><script src="script.js"></script></body></html>
