<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANOVA / Regression</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><div class="logo">Statistical Hub</div><a href="index.html">Home</a><a href="statistical-tools.html">Statistical Tools</a><a href="distributions.html">Distributions</a><a href="statistical-tables.html">Statistical Tables</a><a href="formulas.html">Formula</a><a href="about.html">About</a></nav><div class="container"><div class="panel"><h1>ANOVA / Regression</h1><p class="muted">Excel-style demo structure.</p><div class="form-grid"><div class="field"><label>Y</label><input id="y" value="12,15,18,20,23,25,28,30"></div><div class="field"><label>X</label><input id="x" value="1,2,3,4,5,6,7,8"></div></div><br><button class="btn" onclick="go()">Calculate</button></div><div id="o"></div></div><script>function go(){let y=document.getElementById('y').value.split(',').map(Number),x=document.getElementById('x').value.split(',').map(Number),n=Math.min(x.length,y.length),mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n,sxx=0,sxy=0,syy=0;for(let i=0;i<n;i++){sxx+=(x[i]-mx)**2;sxy+=(x[i]-mx)*(y[i]-my);syy+=(y[i]-my)**2}let b=sxy/sxx,a=my-b*mx,SSE=syy-b*sxy,SSR=syy-SSE,MSE=SSE/(n-2),F=SSR/MSE,R2=SSR/syy,R=Math.sqrt(R2),se=Math.sqrt(MSE),t=b/(se/Math.sqrt(sxx));document.getElementById('o').innerHTML='<div class="panel"><h2>SUMMARY OUTPUT</h2><h3>Regression Statistics</h3><table class="data-table"><tr><td>Multiple R</td><td>'+R.toFixed(9)+'</td></tr><tr><td>R Square</td><td>'+R2.toFixed(9)+'</td></tr><tr><td>Adjusted R Square</td><td>'+(1-(1-R2)*(n-1)/(n-2)).toFixed(9)+'</td></tr><tr><td>Standard Error</td><td>'+se.toFixed(9)+'</td></tr><tr><td>Observations</td><td>'+n+'</td></tr></table><h3>ANOVA</h3><div class="table-wrap"><table class="data-table"><tr><th>Source</th><th>df</th><th>SS</th><th>MS</th><th>F</th></tr><tr><td>Regression</td><td>1</td><td>'+SSR.toFixed(6)+'</td><td>'+SSR.toFixed(6)+'</td><td>'+F.toFixed(6)+'</td></tr><tr><td>Residual</td><td>'+String(n-2)+'</td><td>'+SSE.toFixed(6)+'</td><td>'+MSE.toFixed(6)+'</td><td>—</td></tr><tr><td>Total</td><td>'+String(n-1)+'</td><td>'+syy.toFixed(6)+'</td><td>—</td><td>—</td></tr></table></div><h3>Coefficients</h3><table class="data-table"><tr><th>Term</th><th>Coefficients</th><th>Standard Error</th><th>t Stat</th></tr><tr><td>Intercept</td><td>'+a.toFixed(6)+'</td><td>'+ (se*Math.sqrt(1/n+mx*mx/sxx)).toFixed(6)+'</td><td>'+ (a/(se*Math.sqrt(1/n+mx*mx/sxx))).toFixed(6)+'</td></tr><tr><td>X Variable 1</td><td>'+b.toFixed(6)+'</td><td>'+ (se/Math.sqrt(sxx)).toFixed(6)+'</td><td>'+t.toFixed(6)+'</td></tr></table></div><div class="panel"><h3>Formulas Used</h3><p>b = Sxy / Sxx; &nbsp; a = ȳ − bx̄; &nbsp; F = MSR/MSE; &nbsp; R² = SSR/SST</p><b>Comment:</b> Regression output generated automatically.</div>'}go();</script><div class="footer">Statistical Hub — Full Demo</div></body></html>
