<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastery Test — Statistical Hub</title><link rel="stylesheet" href="style.css"><style>main{padding:28px 0 70px}.card,.q{background:#fff;border:1px solid #dfe6ef;border-radius:15px;padding:18px}.q{margin:12px 0}.q label{display:block;padding:9px;border-radius:8px;line-height:1.45}.q label:hover{background:#f3f6fb}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-size:28px;font-weight:900}.warn{font-size:32px!important}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.danger{background:#b42318!important}.ok{padding:15px;border-radius:12px;background:#effcf4;border:1px solid #9ddbb7}.bad{padding:15px;border-radius:12px;background:#fff1f1;border:1px solid #efb1b1}.review{padding:12px;border:1px solid #e1e7ef;border-radius:10px;margin:10px 0}.correct{border-left:4px solid #178a4b}.wrong{border-left:4px solid #b42318}.muted{color:#667085}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef3ff;color:#2458a6;font-weight:800;font-size:11px}.result-score{font-size:48px;font-weight:900;margin:8px 0}@media(max-width:700px){.timer{font-size:22px}}</style></head><body><header class="header"><a class="brand" href="index.html"><span class="logo">Σ</span><span>Statistical <b>Hub</b></span></a><button class="menu-btn">☰</button></header><nav class="menu"><a href="data-science-academy.html">🧠 Academy</a><a href="data-science-master-v4.html">📘 Course</a></nav><main class="container"><div id="app"></div></main><script src="data-science-master-content.js"></script><script>
const params=new URLSearchParams(location.search),id=Math.max(1,Math.min(200,Number(params.get('class'))||1));
const lists=[['Perception of Research','Assortment of a Problem','Appraise of Related Literature','Foundation of Hypothesis','Research Planning and Sampling','Survey Method','Historical Method','Philosophical Method','Experimental Method','Case Study Method','Genetic Method','Design of Experiments','Tools of Research','Collection of Data','Analysis of Data','Research Report','Action Research','Organisation of Statistical Data','Measures of Central Tendency','Measures of Variability','Correlation'],['Algebra','Functions and transformations','Exponents and logarithms','Summation notation','Differentiation and optimization','Partial derivatives and gradients','Matrices','Vectors and geometry','Linear systems','Eigenvalues/eigenvectors','Descriptive statistics and moments','Combinatorics and conditional probability','Random variables and expectation','Discrete distributions','Continuous distributions','Joint/marginal/conditional distributions','Covariance/correlation','Likelihood and MLE'],['Research setup','Data validation','Formulas/references','Logical functions','Text cleaning','Dates/time','XLOOKUP and INDEX-MATCH','Conditional aggregation','Sort/filter/duplicates','Tables','Pivot Tables','Pivot Charts','Descriptive statistics','Correlation/covariance','Simple regression','Multiple regression','ANOVA/post-hoc','Power Query','Power Pivot/data models','Research dashboard'],['R/RStudio','Vectors/operators','Matrices/lists','Data frames/factors','Functions/vectorization','Packages/environments','Import/export','Base R cleaning','dplyr','Joins','tidyr','Dates','ggplot2','Descriptive statistics','Probability simulation','Distributions','Sampling/confidence intervals','Hypothesis testing','Correlation','Regression','ANOVA','Non-parametric methods','Multivariate methods','Diagnostics','R Markdown/Quarto project'],['Python/Jupyter','Variables/types','Data structures','Conditions/loops','Functions/modules','NumPy','NumPy linear algebra','Pandas','Import CSV/Excel/JSON/SQL','Cleaning/types','Missing data','Outliers','Feature engineering','Groupby/merge/reshape','Matplotlib','Seaborn','EDA','Inference','Regression/statsmodels','scikit-learn workflow','Train/validation/test','Cross-validation/pipelines','Regularization/feature selection','Hyperparameter tuning','Complete Python project'],['Database concepts','Keys and relationships','SELECT/WHERE','ORDER/DISTINCT/NULL','GROUP BY/aggregates','HAVING','JOINs','Multi-table research queries','Subqueries','CTEs','CASE','Dates/cohorts','Window functions','Data quality/constraints','Normalization/indexes/performance','SQL project'],['SPSS setup','Variable/Data View','Coding/labels/recoding','Missing values','Descriptives/Explore','Crosstabs/chi-square','Independent t-test','Paired t-test','One-way ANOVA/effect/post-hoc','Two-way ANOVA','ANCOVA','Correlation/partial correlation','Linear regression','Diagnostics','Non-parametric tests','Logistic regression','Factor/PCA','Academic reporting/syntax'],['Stata workflow','Stata data management','Stata descriptive analysis','Stata regression','Stata diagnostics/panel','EViews econometrics','Jamovi','JASP','G*Power','Cross-software verification'],['Visualization principles','Research figures','Dashboard storytelling','Power BI/import','Power Query','Data models/star schema','DAX/filter context','KPIs/interactions','Tableau dashboards','Publication-quality visualization'],['Estimation/confidence intervals','Power/sample size','Hypothesis testing/multiple comparisons','Effect sizes','ANOVA families','LSD/Tukey/Bonferroni/DMRT','Partial/rank correlation','Multiple regression','Regression diagnostics','Multicollinearity/influence','Logistic regression','GLM concepts','PCA','Factor analysis','Cluster analysis','Advanced statistics project'],['SEM foundations','Constructs/indicators','Reflective models','Formative models','Reliability/validity','PLS-SEM measurement','Structural model/R²/f²/predictive relevance','Bootstrapping/hypotheses','Mediation/moderation/multi-group','End-to-end PLS-SEM project'],['ML problem framing','Supervised vs unsupervised','Data leakage','Feature engineering','Baselines/evaluation','Predictive regression','Ridge/Lasso/Elastic Net','Logistic classification','Decision trees','Random forests','Gradient boosting','kNN','SVM','Naive Bayes','k-means/hierarchical clustering','Dimensionality reduction','Imbalanced data/metrics','Hyperparameter tuning','Interpretation/fairness/responsible AI','End-to-end capstone and final defense']];
const phaseNames=['Research & Research Design','Mathematics, Probability & Statistical Foundations','Excel for Research & Data Analysis','R Programming & Statistical Research','Python Programming & Data Science','SQL & Data Management','SPSS for Academic Research','Additional Research Software & Power','Visualization, Communication & BI','Advanced Statistics & Research Analysis','SEM, Measurement & SmartPLS','Machine Learning, AI & Capstone Research'];let C=[],n=1;lists.forEach((a,p)=>a.forEach(title=>C.push({id:n++,title,phase:p})));const c=C[id-1];
function state(){try{return JSON.parse(localStorage.getItem('stacal_ds_master_final')||'{}')}catch(e){return {}}}function unlocked(i){return i===1||!!state()[i-1]?.passed}
if(!unlocked(id)){document.getElementById('app').innerHTML='<div class="card"><h1>🔒 Test Locked</h1><p>Pass Class '+String(id-1).padStart(3,'0')+' with at least 90% first.</p><a class="btn" href="data-science-master-v4.html#'+(id-1)+'">Back to Previous Class</a></div>';}else{
const isResearch=id<=21;const chapter=c.title;const book='Fundamental of Research Methodology and Statistics — Yogesh Kumar Singh';
function makeBank(){let B=[];const add=(type,q,o,a,topic)=>B.push({type,q,o,a,topic});
if(isResearch){const base=[
['Theory','What is the primary purpose of research?',['To discover, verify or develop knowledge through systematic inquiry.','To collect information without a question.','To guarantee a desired conclusion.','To avoid evidence.'],0,'Research fundamentals'],
['Theory','A well-defined research problem should primarily be:',['Specific, researchable and supported by a clear rationale.','Extremely broad and impossible to measure.','Chosen after seeing the final result.','Free from any literature review.'],0,'Research problem'],
['Theory','What is the main value of reviewing related literature?',['To identify existing knowledge, gaps, concepts and appropriate methods.','To copy previous conclusions.','To avoid defining variables.','To replace data collection in every study.'],0,'Related literature'],
['Theory','A research hypothesis is best described as:',['A testable proposition about a relationship or difference.','A guaranteed conclusion.','A list of references.','A raw dataset.'],0,'Hypothesis'],
['Theory','Which sampling approach gives every population member a known non-zero probability of selection?',['Probability sampling.','Convenience sampling.','Purposive sampling.','Snowball sampling.'],0,'Sampling'],
['Research','A researcher wants to estimate the prevalence of a behavior in a defined population. Which design is generally suitable for collecting data at one point in time?',['Cross-sectional survey.','Historical biography only.','Laboratory experiment only.','Case report only.'],0,'Survey Method'],
['Research','Which feature most strongly supports a causal interpretation in an experiment?',['Manipulation with appropriate control/comparison and randomization where feasible.','Only a large sample.','A statistically significant correlation alone.','A descriptive table alone.'],0,'Experimental Method'],
['Theory','The historical method primarily examines:',['Past events and evidence to understand historical developments.','Only laboratory measurements.','Only future forecasts.','Only experimental treatments.'],0,'Historical Method'],
['Theory','A case study usually provides:',['An in-depth investigation of a bounded case in its real context.','A guarantee of population-wide causality.','Only a national census.','Only a mathematical proof.'],0,'Case Study Method'],
['Theory','A research tool should be selected mainly according to:',['The research objectives, variables, population and required evidence.','Its visual appearance only.','Whether it produces a significant p-value.','Whether it is the newest software.'],0,'Tools of Research'],
['Math','For observations 2, 4 and 6, the arithmetic mean is:',['4','3','6','12'],0,'Measures of Central Tendency'],
['Math','For values 1, 2, 3, 4, 5, the median is:',['3','2','4','5'],0,'Measures of Central Tendency'],
['Math','Which measure is most directly based on the squared deviations from the mean?',['Variance.','Median.','Mode.','Range.'],0,'Measures of Variability'],
['Math','If covariance(X,Y) is positive, the variables tend to:',['Move in the same direction linearly.','Always have a causal relationship.','Have zero association.','Have a perfect negative relationship.'],0,'Correlation'],
['Math','Pearson correlation r must lie between:',['−1 and +1','0 and 100','−∞ and +∞','1 and 2'],0,'Correlation'],
['Research','Why should data be coded consistently before statistical analysis?',['To ensure categories are represented and analyzed correctly.','To increase the sample size.','To guarantee normality.','To create causality.'],0,'Collection of Data'],
['Reporting','A research report should normally include:',['Methods, results, interpretation, limitations and appropriate references.','Only the final p-value.','Only raw data with no method.','Only the abstract.'],0,'Research Report'],
['Theory','Action research is especially associated with:',['Systematic inquiry aimed at improving practice through cycles of action and reflection.','Only historical archives.','Only theoretical mathematics.','Only national population censuses.'],0,'Action Research'],
['Math','If the values are 10, 20, 30, the range is:',['20','10','30','60'],0,'Measures of Variability'],
['Research','The unit of analysis refers to:',['The entity about which observations and conclusions are made.','Only the statistical software.','Only the research title.','Only the bibliography.'],0,'Research Planning']];base.forEach(x=>add(...x));
for(let k=0;k<10;k++)add(k%3===0?'Math':'Theory',`Which statement is most appropriate when studying ${chapter}?`,['The method should be aligned with the research objective, design and evidence.','The most complicated method is always best.','Results should be changed to fit expectations.','Assumptions and limitations can be ignored.'],0,chapter);
}else{const generic=[['Theory',`What is the most defensible first step in ${chapter}?`,['Define the research question, data structure and assumptions.','Choose the most complex method.','Delete unusual observations first.','Report a p-value before inspecting data.'],0,'Research design'],['Theory','Which practice best improves validity?',['Match the method to the design, variables and assumptions.','Use the same method for every outcome.','Ignore missing values.','Change the method until significance appears.'],0,'Validity'],['Math','A 95% large-sample confidence interval is commonly written as:',['estimate ± 1.96 × SE','estimate ± SE²','1.96 × estimate / SE','SE − 1.96'],0,'Statistical interpretation'],['Math','If p = 0.032 and α = 0.05, the conventional decision is:',['Reject H₀, subject to assumptions.','Accept H₀ as proven.','Reject H₁.','The effect must be practically large.'],0,'Hypothesis testing'],['Programming','Which practice supports reproducible R analysis?',['Save a script that imports raw data and documents transformations.','Enter final values manually and discard code.','Edit raw data after seeing results.','Hide processing steps.'],0,'R programming'],['Data','Before analyzing a CSV, inspect:',['Names, types, units, coding, missing values and plausible ranges.','Only the first row.','Only the maximum.','Only whether it opens.'],0,'Data quality'],['Reporting','A strong research report includes:',['Estimate/statistic, uncertainty/effect, assumptions and contextual interpretation.','Only a p-value.','Only a screenshot.','Only a conclusion.'],0,'Reporting']];generic.forEach(x=>add(...x));for(let k=0;k<13;k++)add(k%2?'Programming':'Theory',`Which principle is most important when applying ${chapter} to research data?`,['Use a documented, reproducible workflow and verify assumptions and outputs.','Ignore the data dictionary.','Change data until the result is significant.','Skip interpretation.'],0,chapter)}return B}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function buildSet(){return shuffle(makeBank()).slice(0,20).map((x,i)=>{let p=x.o.map((v,j)=>({v,j}));shuffle(p);return {...x,num:i+1,o:p.map(z=>z.v),a:p.findIndex(z=>z.j===x.a)}})}let chosen=buildSet(),remaining=1200,timer=null,submitted=false;
function saveAttempt(score,correct){let s=state(),old=s[id]||{attempts:0,best:0};const passed=score>=90;s[id]={attempts:(old.attempts||0)+1,best:Math.max(old.best||0,score),latest:score,passed:!!old.passed||passed,last:new Date().toISOString(),lastCorrect:correct};localStorage.setItem('stacal_ds_master_final',JSON.stringify(s));return passed}
function renderStart(){document.getElementById('app').innerHTML=`<div class="card"><span class="tag">CLASS ${String(id).padStart(3,'0')}</span><h1>${chapter}</h1><p class="muted">Reference: <b>${book}</b></p><p>20 questions • 100 marks • 20 minutes • Pass ≥ 90% (18/20)</p><p>Pattern: Theory + Mathematical + Programming + Research/Data Interpretation.</p><div class="btnrow"><button class="btn" onclick="start()">▶ START TEST</button><a class="btn" href="data-science-master-v4.html#${id}">Back to Class</a></div></div>`}
function start(){chosen=buildSet();remaining=1200;submitted=false;renderExam();clearInterval(timer);timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);submit(true)}},1000)}function updateTimer(){const e=document.getElementById('timer');if(e){e.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;if(remaining<=120)e.classList.add('warn')}}
function renderExam(){document.getElementById('app').innerHTML=`<div class="card"><div class="top"><div><span class="tag">CLASS ${String(id).padStart(3,'0')}</span><h2>${chapter}</h2></div><div class="timer" id="timer">20:00</div></div><p class="muted">20 questions × 5 marks = 100. Passing score = 90.</p><form id="exam">${chosen.map((x,i)=>`<div class="q"><b>Q${i+1}. [${x.type}]</b><p>${x.q}</p>${x.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<div class="btnrow"><button class="btn" type="button" onclick="submit(false)">✓ SUBMIT TEST</button><button class="btn danger" type="button" onclick="restTest()">↻ REST — NEW QUESTIONS</button></div></form></div>`;updateTimer()}
function submit(auto){if(submitted)return;submitted=true;clearInterval(timer);let correct=0,answers=[];chosen.forEach((x,i)=>{const el=document.querySelector(`input[name="q${i}"]:checked`);const ans=el?Number(el.value):null;if(ans===x.a)correct++;answers.push(ans)});const score=correct*5,passed=saveAttempt(score,correct);renderResult(score,correct,passed,answers,auto)}
function renderResult(score,correct,passed,answers,auto){const wrong=20-correct;document.getElementById('app').innerHTML=`<div class="card"><span class="tag">TEST RESULT</span><h1>Class ${String(id).padStart(3,'0')} — ${chapter}</h1><div class="result-score">${score}/100</div><p><b>${correct}</b> Correct &nbsp; | &nbsp; <b>${wrong}</b> Wrong/Unanswered &nbsp; | &nbsp; ${auto?'Time expired':''}</p><div class="${passed?'ok':'bad'}"><h2>${passed?'🎉 PASSED — Next Class Unlocked':'❌ NOT PASSED'}</h2><p>${passed?'You scored at least 90%. Class '+String(id+1).padStart(3,'0')+' is now unlocked.':'You need at least 90% (18/20) to unlock the next class.'}</p></div><div class="btnrow"><button class="btn" onclick="restTest()">↻ REST — NEW QUESTIONS</button><a class="btn" href="data-science-master-v4.html#${passed?id+1:id}">${passed?'Go to Next Class':'Back to Class'}</a></div><h2>Question Review</h2>${chosen.map((x,i)=>{const ans=answers[i];return `<div class="review ${ans===x.a?'correct':'wrong'}"><b>Q${i+1}. ${x.type}</b><p>${x.q}</p><p>Your answer: <b>${ans===null?'Not answered':x.o[ans]}</b></p>${ans!==x.a?`<p>Correct answer: <b>${x.o[x.a]}</b></p>`:''}<small class="muted">Topic: ${x.topic}</small></div>`}).join('')}</div>`}
function restTest(){chosen=buildSet();remaining=1200;submitted=false;renderExam();clearInterval(timer);timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);submit(true)}},1000)}renderStart();}
</script></body></html>
