<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastery Test — Statistical Hub</title><link rel="stylesheet" href="style.css"><style>main{padding:28px 0 70px}.card,.q{background:#fff;border:1px solid #dfe6ef;border-radius:15px;padding:18px}.q{margin:12px 0}.q label{display:block;padding:9px;border-radius:8px;line-height:1.45}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-size:28px;font-weight:900}.warn{color:#b42318}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.danger{background:#b42318!important}.ok{padding:15px;border-radius:12px;background:#effcf4;border:1px solid #9ddbb7}.bad{padding:15px;border-radius:12px;background:#fff1f1;border:1px solid #efb1b1}.review{padding:12px;border:1px solid #e1e7ef;border-radius:10px;margin:10px 0}.correct{border-left:4px solid #178a4b}.wrong{border-left:4px solid #b42318}.muted{color:#667085}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef3ff;color:#2458a6;font-weight:800;font-size:11px}.result-score{font-size:48px;font-weight:900;margin:8px 0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid #e1e7ef;border-radius:10px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}@media(max-width:700px){.timer{font-size:22px}.statgrid{grid-template-columns:1fr}}</style></head>
<body><header class="header"><a class="brand" href="index.html"><span class="logo">Σ</span><span>Statistical <b>Hub</b></span></a><button class="menu-btn">☰</button></header><nav class="menu"><a href="data-science-academy.html">🧠 Academy</a><a href="data-science-master-v4.html">📘 Course</a></nav><main class="container"><div id="app"></div></main>
<script>
const lists=[['Research & Research Design',['Perception of Research','Assortment of a Problem','Appraise of Related Literature','Foundation of Hypothesis','Research Planning and Sampling','Survey Method','Historical Method','Philosophical Method','Experimental Method','Case Study Method','Genetic Method','Design of Experiments','Tools of Research','Collection of Data','Analysis of Data','Research Report','Action Research','Organisation of Statistical Data','Measures of Central Tendency','Measures of Variability','Correlation']],['Mathematics, Probability & Statistical Foundations',['Algebra','Functions and transformations','Exponents and logarithms','Summation notation','Differentiation and optimization','Partial derivatives and gradients','Matrices','Vectors and geometry','Linear systems','Eigenvalues/eigenvectors','Descriptive statistics and moments','Combinatorics and conditional probability','Random variables and expectation','Discrete distributions','Continuous distributions','Joint/marginal/conditional distributions','Covariance/correlation','Likelihood and MLE']],['Excel for Research & Data Analysis',['Research setup','Data validation','Formulas/references','Logical functions','Text cleaning','Dates/time','XLOOKUP and INDEX-MATCH','Conditional aggregation','Sort/filter/duplicates','Tables','Pivot Tables','Pivot Charts','Descriptive statistics','Correlation/covariance','Simple regression','Multiple regression','ANOVA/post-hoc','Power Query','Power Pivot/data models','Research dashboard']],['R Programming & Statistical Research',['R/RStudio','Vectors/operators','Matrices/lists','Data frames/factors','Functions/vectorization','Packages/environments','Import/export','Base R cleaning','dplyr','Joins','tidyr','Dates','ggplot2','Descriptive statistics','Probability simulation','Distributions','Sampling/confidence intervals','Hypothesis testing','Correlation','Regression','ANOVA','Non-parametric methods','Multivariate methods','Diagnostics','R Markdown/Quarto project']],['Python Programming & Data Science',['Python/Jupyter','Variables/types','Data structures','Conditions/loops','Functions/modules','NumPy','NumPy linear algebra','Pandas','Import CSV/Excel/JSON/SQL','Cleaning/types','Missing data','Outliers','Feature engineering','Groupby/merge/reshape','Matplotlib','Seaborn','EDA','Inference','Regression/statsmodels','scikit-learn workflow','Train/validation/test','Cross-validation/pipelines','Regularization/feature selection','Hyperparameter tuning','Complete Python project']],['SQL & Data Management',['Database concepts','Keys and relationships','SELECT/WHERE','ORDER/DISTINCT/NULL','GROUP BY/aggregates','HAVING','JOINs','Multi-table research queries','Subqueries','CTEs','CASE','Dates/cohorts','Window functions','Data quality/constraints','Normalization/indexes/performance','SQL project']],['SPSS for Academic Research',['SPSS setup','Variable/Data View','Coding/labels/recoding','Missing values','Descriptives/Explore','Crosstabs/chi-square','Independent t-test','Paired t-test','One-way ANOVA/effect/post-hoc','Two-way ANOVA','ANCOVA','Correlation/partial correlation','Linear regression','Diagnostics','Non-parametric tests','Logistic regression','Factor/PCA','Academic reporting/syntax']],['Additional Research Software & Power',['Stata workflow','Stata data management','Stata descriptive analysis','Stata regression','Stata diagnostics/panel','EViews econometrics','Jamovi','JASP','G*Power','Cross-software verification']],['Visualization, Communication & BI',['Visualization principles','Research figures','Dashboard storytelling','Power BI/import','Power Query','Data models/star schema','DAX/filter context','KPIs/interactions','Tableau dashboards','Publication-quality visualization']],['Advanced Statistics & Research Analysis',['Estimation/confidence intervals','Power/sample size','Hypothesis testing/multiple comparisons','Effect sizes','ANOVA families','LSD/Tukey/Bonferroni/DMRT','Partial/rank correlation','Multiple regression','Regression diagnostics','Multicollinearity/influence','Logistic regression','GLM concepts','PCA','Factor analysis','Cluster analysis','Advanced statistics project']],['SEM, Measurement & SmartPLS',['SEM foundations','Constructs/indicators','Reflective models','Formative models','Reliability/validity','PLS-SEM measurement','Structural model/R²/f²/predictive relevance','Bootstrapping/hypotheses','Mediation/moderation/multi-group','End-to-end PLS-SEM project']],['Machine Learning, AI & Capstone Research',['ML problem framing','Supervised vs unsupervised','Data leakage','Feature engineering','Baselines/evaluation','Predictive regression','Ridge/Lasso/Elastic Net','Logistic classification','Decision trees','Random forests','Gradient boosting','kNN','SVM','Naive Bayes','k-means/hierarchical clustering','Dimensionality reduction','Imbalanced data/metrics','Hyperparameter tuning','Interpretation/fairness/responsible AI','End-to-end capstone and final defense']]];
let C=[],n=1;lists.forEach((p,pi)=>p[1].forEach(title=>C.push({id:n++,title,phase:pi})));const TOTAL=C.length;const rawId=Number(new URLSearchParams(location.search).get('class'));const id=Number.isInteger(rawId)&&rawId>0?rawId:1;const c=C[id-1];
function state(){try{return JSON.parse(localStorage.getItem('stacal_ds_master_final')||'{}')}catch(e){return {}}}function unlocked(i){return i===1||!!state()[i-1]?.passed}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
if(!c){document.getElementById('app').innerHTML='<div class="card"><h1>Invalid Class</h1><p>Total classes: '+TOTAL+'</p></div>'}else if(!unlocked(id)){document.getElementById('app').innerHTML='<div class="card"><h1>🔒 Test Locked</h1><p>Pass Class '+String(id-1).padStart(3,'0')+' with at least 90% first.</p><a class="btn" href="data-science-master-v4.html#'+(id-1)+'">Back to Previous Class</a></div>'}else{
const chapter=c.title,isResearch=id<=21,book=isResearch?'Fundamental of Research Methodology and Statistics — Yogesh Kumar Singh':'Recommended course reference';
const base=[['Theory','What is the primary purpose of research?',['To discover, verify or develop knowledge through systematic inquiry.','To guarantee a desired conclusion.','To avoid evidence.','To collect information without a question.'],0,'Perception of Research'],['Theory','A good research problem should be:',['Specific, researchable and supported by a clear rationale.','Extremely broad and impossible to measure.','Chosen after the result is known.','Independent of literature.'],0,'Assortment of a Problem'],['Theory','A literature review helps identify:',['Existing knowledge, gaps, concepts and appropriate methods.','Only significant p-values.','Only software errors.','Only the final conclusion.'],0,'Appraise of Related Literature'],['Theory','A hypothesis is:',['A testable proposition about a relationship or difference.','A guaranteed conclusion.','A bibliography.','A raw dataset.'],0,'Foundation of Hypothesis'],['Theory','Probability sampling gives units:',['Known non-zero probabilities of selection.','No chance of selection.','Only volunteer selection.','Only convenience selection.'],0,'Research Planning and Sampling'],['Research','For prevalence at one point in time, a suitable design is:',['Cross-sectional survey.','Historical method only.','Laboratory experiment only.','Case report only.'],0,'Survey Method'],['Research','Which most supports causal inference in an experiment?',['Manipulation with appropriate control/comparison and randomization where feasible.','A large sample alone.','Correlation alone.','A descriptive table.'],0,'Experimental Method'],['Theory','Historical method primarily examines:',['Past events and evidence to understand historical development.','Only future forecasts.','Only laboratory treatments.','Only current opinions.'],0,'Historical Method'],['Theory','A case study is generally:',['An in-depth study of a bounded case in its real context.','A guaranteed population-wide experiment.','Only a census.','Only a mathematical proof.'],0,'Case Study Method'],['Theory','A research tool should be selected according to:',['Objectives, variables, population and required evidence.','Appearance only.','Whether it gives significance.','Whether it is newest.'],0,'Tools of Research'],['Math','For 2, 4 and 6, the mean is:',['4','3','6','12'],0,'Measures of Central Tendency'],['Math','For 1, 2, 3, 4, 5, the median is:',['3','2','4','5'],0,'Measures of Central Tendency'],['Math','Which measure uses squared deviations from the mean?',['Variance.','Median.','Mode.','Range.'],0,'Measures of Variability'],['Math','Pearson correlation r must lie between:',['−1 and +1','0 and 100','−∞ and +∞','1 and 2'],0,'Correlation'],['Research','Why is consistent coding important?',['It ensures categories are represented and analyzed correctly.','It increases sample size.','It guarantees normality.','It creates causality.'],0,'Collection of Data'],['Reporting','A strong research report includes:',['Methods, results, interpretation, limitations and references.','Only a p-value.','Only raw data.','Only an abstract.'],0,'Research Report'],['Theory','Action research is associated with:',['Cycles of action, reflection and improvement of practice.','Only archives.','Only mathematics.','Only censuses.'],0,'Action Research'],['Math','For 10, 20 and 30, the range is:',['20','10','30','60'],0,'Measures of Variability'],['Theory','The unit of analysis is:',['The entity about which observations and conclusions are made.','Only software.','Only the title.','Only the bibliography.'],0,'Research Planning and Sampling'],['Math','If covariance(X,Y)>0, variables tend to:',['Move in the same direction linearly.','Have guaranteed causality.','Have zero association.','Have perfect negative association.'],0,'Correlation']];
function makeBank(){let b=isResearch?base.slice():[['Theory','Which practice is most defensible in '+chapter+'?',['Match the method to the research objective, design and evidence.','Choose the most complex method.','Ignore assumptions.','Change results to fit expectations.'],0,chapter],['Math','A 95% large-sample confidence interval is commonly written as:',['estimate ± 1.96 × SE','estimate ± SE²','estimate − SE','1.96 × estimate'],0,'Statistical interpretation'],['Programming','Which practice supports reproducible analysis?',['Save code, document transformations and preserve raw data.','Edit raw data after results.','Delete scripts.','Hide preprocessing.'],0,'Reproducibility']];for(let k=0;k<40;k++)b.push([k%3===0?'Math':'Theory','Which statement is most appropriate for '+chapter+'?',['Use a documented method aligned with the research question and assumptions.','The most complicated method is always best.','Significance is guaranteed by a large sample.','Limitations can be ignored.'],0,chapter]);return b}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function rng(seed){let x=seed>>>0;return()=>((x=x*1664525+1013904223>>>0)/4294967296)}
let seed=(Number(localStorage.getItem('stacal_test_seed_'+id)||0)+1);localStorage.setItem('stacal_test_seed_'+id,seed);let chosen=[],remaining=1200,timer=null,submitted=false;
function buildSet(){let r=rng((Date.now()+id*1009+seed*9176)>>>0),pool=makeBank();shuffle(pool,r);return pool.slice(0,20).map(x=>{let o=x[2].map((v,j)=>({v,j}));shuffle(o,r);return {type:x[0],q:x[1],o:o.map(z=>z.v),a:o.findIndex(z=>z.j===x[3]),topic:x[4]}})}
function save(score,correct){let s=state(),old=s[id]||{},pass=score>=90;s[id]={attempts:(old.attempts||0)+1,best:Math.max(Number(old.best)||0,score),latest:score,passed:!!old.passed||pass,last:new Date().toISOString(),lastCorrect:correct};localStorage.setItem('stacal_ds_master_final',JSON.stringify(s));return pass}
function start(){seed++;localStorage.setItem('stacal_test_seed_'+id,seed);chosen=buildSet();remaining=1200;submitted=false;renderExam();clearInterval(timer);timer=setInterval(()=>{remaining--;tick();if(remaining<=0){clearInterval(timer);window.submitTest(true)}},1000)}
function tick(){let e=document.getElementById('timer');if(e){e.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining<=120)e.classList.add('warn')}}
function renderStart(){document.getElementById('app').innerHTML='<div class="card"><span class="tag">CLASS '+String(id).padStart(3,'0')+'</span><h1>'+esc(chapter)+'</h1><p class="muted">Reference: <b>'+esc(book)+'</b></p><p><b>20 questions • 100 marks • 20 minutes • Pass ≥ 90% (18/20)</b></p><p>Each correct answer = 5 marks.</p><div class="btnrow"><button class="btn" type="button" id="startTestBtn">▶ START TEST</button><a class="btn" href="data-science-master-v4.html#'+id+'">Back to Class</a></div></div>';document.getElementById('startTestBtn').addEventListener('click',start)}
function renderExam(){document.getElementById('app').innerHTML='<div class="card"><div class="top"><div><span class="tag">CLASS '+String(id).padStart(3,'0')+'</span><h2>'+esc(chapter)+'</h2></div><div class="timer" id="timer">20:00</div></div><p class="muted">20 questions × 5 marks = 100</p><form id="exam" onsubmit="return false;">'+chosen.map((x,i)=>'<div class="q"><b>Q'+(i+1)+'. ['+esc(x.type)+']</b><p>'+esc(x.q)+'</p>'+x.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</div>').join('')+'<div class="btnrow"><button class="btn" type="button" id="submitTestBtn">✓ SUBMIT TEST</button><button class="btn danger" type="button" id="resetTestBtn">↻ REST — NEW QUESTIONS</button></div></form></div>';tick();document.getElementById('submitTestBtn').addEventListener('click',()=>submitTest(false));document.getElementById('resetTestBtn').addEventListener('click',resetTest)}
function submitTest(auto){if(submitted)return;submitted=true;clearInterval(timer);let correct=0,answers=[];chosen.forEach((x,i)=>{let el=document.querySelector('input[name="q'+i+'"]:checked');let a=el?Number(el.value):null;answers.push(a);if(a===x.a)correct++});let score=correct*5,pass=save(score,correct);renderResult(score,correct,pass,answers,auto)}
function renderResult(score,correct,pass,answers,auto){let next=id<TOTAL?id+1:null;document.getElementById('app').innerHTML='<div class="card"><span class="tag">TEST RESULT</span><h1>Class '+String(id).padStart(3,'0')+' — '+esc(chapter)+'</h1><div class="result-score">'+score+' / 100</div><div class="statgrid"><div class="stat"><b>'+correct+'/20</b>Correct</div><div class="stat"><b>'+(20-correct)+'/20</b>Wrong / Unanswered</div><div class="stat"><b>'+ (pass?'PASS':'FAIL') +'</b>'+ (pass?'90%+ achieved':'Need 18 correct') +'</div></div><p>'+ (auto?'⏱️ Time expired — automatically submitted.':'') +'</p><div class="'+(pass?'ok':'bad')+'"><h2>'+ (pass?'🎉 PASSED — NEXT CLASS UNLOCKED':'❌ NOT PASSED') +'</h2><p>'+ (pass?(next?'Class '+String(next).padStart(3,'0')+' is now unlocked.':'Final class completed.'):'You need at least 90% (18/20) to unlock the next class.') +'</p></div><div class="btnrow"><button class="btn" type="button" id="resultResetBtn">↻ REST — NEW QUESTIONS</button><a class="btn" href="data-science-master-v4.html#'+(pass&&next?next:id)+'">'+(pass&&next?'Go to Next Class':'Back to Class')+'</a></div><h2>Question Review</h2>'+chosen.map((x,i)=>'<div class="review '+(answers[i]===x.a?'correct':'wrong')+'"><b>Q'+(i+1)+'. '+esc(x.type)+'</b><p>'+esc(x.q)+'</p><p>Your answer: <b>'+(answers[i]===null?'Not answered':esc(x.o[answers[i]]))+'</b></p>'+(answers[i]!==x.a?'<p>Correct answer: <b>'+esc(x.o[x.a])+'</b></p>':'')+'<small class="muted">Topic: '+esc(x.topic)+'</small></div>').join('')+'</div>';document.getElementById('resultResetBtn').addEventListener('click',resetTest)}
function resetTest(){seed++;localStorage.setItem('stacal_test_seed_'+id,seed);chosen=buildSet();remaining=1200;submitted=false;renderExam();clearInterval(timer);timer=setInterval(()=>{remaining--;tick();if(remaining<=0){clearInterval(timer);submitTest(true)}},1000)}
renderStart();
}
</script></body></html>
