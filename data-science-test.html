<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastery Test — Statistical Hub</title><link rel="stylesheet" href="style.css"><style>main{padding:28px 0 70px}.card,.q{background:#fff;border:1px solid #dfe6ef;border-radius:15px;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-size:28px;font-weight:900}.timer.warn{font-size:32px}.q{margin:12px 0}.q label{display:block;padding:9px;border-radius:8px;line-height:1.45}.q label:hover{background:#f3f6fb}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.danger{background:#b42318!important}.ok{padding:15px;border-radius:12px;background:#effcf4;border:1px solid #9ddbb7}.bad{padding:15px;border-radius:12px;background:#fff1f1;border:1px solid #efb1b1}.review{padding:12px;border:1px solid #e1e7ef;border-radius:10px;margin:10px 0}.correct{border-left:4px solid #178a4b}.wrong{border-left:4px solid #b42318}.muted{color:#667085}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef3ff;color:#2458a6;font-weight:800;font-size:11px}@media(max-width:700px){.timer{font-size:22px}.timer.warn{font-size:26px}}</style></head><body><header class="header"><a class="brand" href="index.html"><span class="logo">Σ</span><span>Statistical <b>Hub</b></span></a><button class="menu-btn">☰</button></header><nav class="menu"><a href="data-science-academy.html">🧠 Academy</a><a href="data-science-master-v4.html">📘 Course</a></nav><main class="container"><div id="app"></div></main><script src="data-science-master-content.js"></script><script>
const params=new URLSearchParams(location.search),id=Math.max(1,Math.min(200,+params.get('class')||1));
const titles=['Research & Research Design','Mathematics, Probability & Statistical Foundations','Excel for Research & Data Analysis','R Programming & Statistical Research','Python Programming & Data Science','SQL & Data Management','SPSS for Academic Research','Additional Research Software & Power','Visualization, Communication & BI','Advanced Statistics & Research Analysis','SEM, Measurement & SmartPLS','Machine Learning, AI & Capstone Research'];
const lists=[['Research fundamentals','Research problems and gaps','Questions and objectives','Hypotheses and propositions','Variables and constructs','Measurement and coding','Experimental/observational designs','Population and sampling frame','Probability sampling','Non-probability sampling and bias','Data sources and provenance','Ethics and reproducibility'],['Algebra','Functions and transformations','Exponents and logarithms','Summation notation','Differentiation and optimization','Partial derivatives and gradients','Matrices','Vectors and geometry','Linear systems','Eigenvalues/eigenvectors','Descriptive statistics and moments','Combinatorics and conditional probability','Random variables and expectation','Discrete distributions','Continuous distributions','Joint/marginal/conditional distributions','Covariance/correlation','Likelihood and MLE'],['Research setup','Data validation','Formulas/references','Logical functions','Text cleaning','Dates/time','XLOOKUP and INDEX-MATCH','Conditional aggregation','Sort/filter/duplicates','Tables','Pivot Tables','Pivot Charts','Descriptive statistics','Correlation/covariance','Simple regression','Multiple regression','ANOVA/post-hoc','Power Query','Power Pivot/data models','Research dashboard'],['R/RStudio','Vectors/operators','Matrices/lists','Data frames/factors','Functions/vectorization','Packages/environments','Import/export','Base R cleaning','dplyr','Joins','tidyr','Dates','ggplot2','Descriptive statistics','Probability simulation','Distributions','Sampling/confidence intervals','Hypothesis testing','Correlation','Regression','ANOVA','Non-parametric methods','Multivariate methods','Diagnostics','R Markdown/Quarto project'],['Python/Jupyter','Variables/types','Data structures','Conditions/loops','Functions/modules','NumPy','NumPy linear algebra','Pandas','Import CSV/Excel/JSON/SQL','Cleaning/types','Missing data','Outliers','Feature engineering','Groupby/merge/reshape','Matplotlib','Seaborn','EDA','Inference','Regression/statsmodels','scikit-learn workflow','Train/validation/test','Cross-validation/pipelines','Regularization/feature selection','Hyperparameter tuning','Complete Python project'],['Database concepts','Keys and relationships','SELECT/WHERE','ORDER/DISTINCT/NULL','GROUP BY/aggregates','HAVING','JOINs','Multi-table research queries','Subqueries','CTEs','CASE','Dates/cohorts','Window functions','Data quality/constraints','Normalization/indexes/performance','SQL project'],['SPSS setup','Variable/Data View','Coding/labels/recoding','Missing values','Descriptives/Explore','Crosstabs/chi-square','Independent t-test','Paired t-test','One-way ANOVA/effect/post-hoc','Two-way ANOVA','ANCOVA','Correlation/partial correlation','Linear regression','Diagnostics','Non-parametric tests','Logistic regression','Factor/PCA','Academic reporting/syntax'],['Stata workflow','Stata data management','Stata descriptive analysis','Stata regression','Stata diagnostics/panel','EViews econometrics','Jamovi','JASP','G*Power','Cross-software verification'],['Visualization principles','Research figures','Dashboard storytelling','Power BI/import','Power Query','Data models/star schema','DAX/filter context','KPIs/interactions','Tableau dashboards','Publication-quality visualization'],['Estimation/confidence intervals','Power/sample size','Hypothesis testing/multiple comparisons','Effect sizes','ANOVA families','LSD/Tukey/Bonferroni/DMRT','Partial/rank correlation','Multiple regression','Regression diagnostics','Multicollinearity/influence','Logistic regression','GLM concepts','PCA','Factor analysis','Cluster analysis','Advanced statistics project'],['SEM foundations','Constructs/indicators','Reflective models','Formative models','Reliability/validity','PLS-SEM measurement','Structural model/R²/f²/predictive relevance','Bootstrapping/hypotheses','Mediation/moderation/multi-group','End-to-end PLS-SEM project'],['ML problem framing','Supervised vs unsupervised','Data leakage','Feature engineering','Baselines/evaluation','Predictive regression','Ridge/Lasso/Elastic Net','Logistic classification','Decision trees','Random forests','Gradient boosting','kNN','SVM','Naive Bayes','k-means/hierarchical clustering','Dimensionality reduction','Imbalanced data/metrics','Hyperparameter tuning','Interpretation/fairness/responsible AI','End-to-end capstone and final defense']];
let C=[],n=1;lists.forEach((a,p)=>a.forEach(title=>C.push({id:n++,title,phase:p})));const c=C[id-1];
function state(){try{return JSON.parse(localStorage.getItem('stacal_ds_master_final')||'{}')}catch(e){return {}}}function unlocked(i){return i===1||!!state()[i-1]?.passed}
if(!unlocked(id)){document.getElementById('app').innerHTML=`<div class="card"><h1>🔒 Test Locked</h1><p>You must pass Class ${String(id-1).padStart(3,'0')} with at least 90% before taking this test.</p><a class="btn" href="data-science-master-v4.html#${id-1}">Back to Previous Class</a></div>`;throw new Error('locked');}
const focus=[c.title,'the research question and data structure','assumptions and validity','mathematical/statistical interpretation','software implementation','research reporting'];
function makeBank(){let B=[];const add=(type,q,o,a,topic)=>B.push({type,q,o,a,topic});
add('Theory',`What is the most defensible first step when applying ${c.title} to a research study?`,['Define the research question, unit of analysis and data structure.','Choose the most complex method available.','Start by deleting unusual observations.','Report a p-value before inspecting the data.'],0,focus[1]);
add('Theory',`Which practice best improves the validity of a ${c.title} analysis?`,['Match the method to the design, variables and assumptions.','Use the same method for every outcome.','Ignore missing-value rules.','Change the method until significance appears.'],0,focus[2]);
add('Research',`A researcher obtains a statistically significant result while studying ${c.title}. What is the correct conclusion?`,['State the statistical evidence and substantive meaning without automatically claiming causation.','The hypothesis is proven true in every population.','The result proves the measurement is valid.','The result proves there is no bias.'],0,focus[1]);
add('Math',`A 95% large-sample confidence interval for an estimate θ̂ is most commonly written as:`,['θ̂ ± 1.96 × SE(θ̂)','θ̂ ± SE(θ̂)²','1.96 × θ̂ / SE(θ̂)','SE(θ̂) − 1.96'],0,focus[3]);
add('Math',`If an analysis reports p = 0.032 and α = 0.05, what is the conventional decision under a two-sided test?`,['Reject H₀ at the 5% level, subject to the test assumptions.','Accept H₀ as proven.','Reject H₁.','The effect must be practically large.'],0,focus[3]);
add('Programming',`Which R approach is most appropriate for reproducible ${c.title} practice?`,['Save an R script that imports the raw CSV, performs documented transformations and produces the analysis.','Type final numbers manually into the console and discard the script.','Edit the CSV after seeing the result.','Use undocumented random changes.'],0,focus[4]);
add('Programming',`What does `+'`str(dat)`'+` primarily help you inspect in R?`,['Object structure, variable types and dimensions.','The true causal effect.','The population parameter.','Whether a p-value is significant.'],0,focus[4]);
add('Data',`Before analyzing a research CSV, which check is essential?`,['Variable names, types, units, coding, missing values and plausible ranges.','Only the first row.','Only the largest value.','Only whether the file opens.'],0,focus[2]);
add('Reporting',`Which report is strongest for a research paper using ${c.title}?`,['Method + estimate/statistic + uncertainty/effect + assumptions/diagnostics + contextual interpretation.','Only the p-value.','Only a screenshot of software output.','Only the conclusion without methods.'],0,focus[5]);
add('Research',`Why should a researcher distinguish statistical significance from practical importance?`,['A small p-value does not by itself establish a large or meaningful effect.','Statistical significance always equals clinical importance.','Practical importance cannot be measured.','The distinction is only needed in machine learning.'],0,focus[5]);
add('Math',`If X and Y are perfectly positively linearly related, Pearson's r is closest to:`,['+1','0','−1','2'],0,focus[3]);
add('Math',`For a differentiable objective L(θ), a stationary point satisfies:`,['∇L(θ) = 0','∇L(θ) = 1','L(θ) = 0 for every θ','θ = 0 for every problem'],0,focus[3]);
add('Programming',`Why should preprocessing such as scaling be fitted inside the resampling workflow in predictive modeling?`,['To prevent information from validation/test observations leaking into training.','To increase the sample size.','To guarantee 100% accuracy.','To remove the need for a test set.'],0,focus[4]);
add('Theory',`What does an assumption check actually provide?`,['Evidence about whether the chosen method is reasonably defensible for the observed data.','A guarantee that the hypothesis is true.','A guarantee of causality.','A replacement for study design.'],0,focus[2]);
add('Research',`If the dataset is observational, which wording is generally safest for an association?`,['“X was associated with Y” rather than automatically “X caused Y.”','“X definitely caused Y.”','“Y caused X” without design evidence.','“No uncertainty exists.”'],0,focus[1]);
add('Data',`What is the purpose of a data dictionary?`,['To document variables, types, units, coding and missing-value conventions.','To replace the dataset.','To calculate every p-value automatically.','To hide data-processing decisions.'],0,focus[2]);
add('Theory',`Which item belongs in a reproducible research record?`,['Code, data-processing decisions, software information and analysis outputs.','Only the final graph.','Only the researcher’s memory.','Only the manuscript abstract.'],0,focus[5]);
add('Math',`If an estimate is 12 and SE = 2, the approximate large-sample 95% CI is:`,['8.08 to 15.92','10 to 14','12 to 13.96','2 to 12'],0,focus[3]);
add('Research',`What should happen if the method assumptions are seriously violated?`,['Investigate the violation and consider a justified alternative, robust method or sensitivity analysis.','Hide the diagnostic result.','Automatically remove all observations.','Change the outcome definition after seeing results.'],0,focus[2]);
add('Reporting',`Which conclusion is most transparent?`,['The result supports the stated research question under the study design and assumptions, with limitations noted.','The analysis proves a universal law.','The software produced the truth.','No further verification is necessary.'],0,focus[5]);
return B;}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let bank=makeBank();function buildSet(){let pool=shuffle(bank.slice()),set=pool.slice(0,20);return set.map((x,i)=>{let pairs=x.o.map((v,j)=>({v,j}));shuffle(pairs);return {...x,num:i+1,o:pairs.map(p=>p.v),a:pairs.findIndex(p=>p.j===x.a)}})}
let chosen=buildSet(),remaining=1200,timer=null,submitted=false;
function setKey(){return 'stacal_testset_'+id}
function startSet(){sessionStorage.setItem(setKey(),JSON.stringify(chosen));}
function newSet(){chosen=buildSet();startSet();}
function renderStart(){document.getElementById('app').innerHTML=`<div class="card"><span class="tag">CLASS ${String(id).padStart(3,'0')}</span><h1>${c.title}</h1><p class="muted">20 questions • 100 marks • 20 minutes • Pass ≥ 90% (18/20)</p><p>Pattern: <b>Theory + Mathematical + Programming + Research/Data Interpretation + Reporting</b>.</p><div class="btnrow"><button class="btn" onclick="start()">▶ START TEST</button><a class="btn" href="data-science-master-v4.html#${id}">Back to Class</a></div></div>`}
function start(){newSet();remaining=1200;renderExam();clearInterval(timer);timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);submit(true)}},1000)}
function updateTimer(){let e=document.getElementById('timer');if(e){let m=Math.floor(remaining/60),s=remaining%60;e.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;e.className='timer'+(remaining<=120?' warn':'')}}
function renderExam(){document.getElementById('app').innerHTML=`<div class="card"><div class="top"><div><span class="tag">CLASS ${String(id).padStart(3,'0')}</span><h2>${c.title}</h2></div><div class="timer" id="timer">20:00</div></div><p class="muted">Answer all 20 questions. Each question = 5 marks. Passing score = 90/100.</p><form id="exam">${chosen.map((x,i)=>`<div class="q"><b>Q${i+1}. [${x.type}]</b><p>${x.q}</p>${x.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<div class="btnrow"><button class="btn" type="button" onclick="submit(false)">✓ SUBMIT TEST</button><button class="btn danger" type="button" onclick="restTest()">↻ REST — NEW QUESTIONS</button></div></form></div>`;updateTimer()}
function saveAttempt(score,correct){let s=state(),old=s[id]||{attempts:0,best:0};let ok=score>=90;s[id]={attempts:(old.attempts||0)+1,best:Math.max(old.best||0,score),latest:score,passed:!!old.passed||ok,last:new Date().toISOString(),lastCorrect:correct};localStorage.setItem('stacal_ds_master_final',JSON.stringify(s));}
function submit(auto){if(submitted)return;submitted=true;clearInterval(timer);let correct=0;chosen.forEach((x,i)=>{let el=document.querySelector(`input[name=q${i}]:checked`);if(el&&+el.value===x.a)correct++});let score=correct*5;saveAttempt(score,correct);let passed=score>=90;let reviews=chosen.map((x,i)=>{let el=document.querySelector(`input[name=q${i}]:checked`),got=el?+el.value:-1,ok=got===x.a;return `<div class="review ${ok?'correct':'wrong'}"><b>Q${i+1}. ${ok?'✓ Correct':'✗ Incorrect'}</b><p>${x.q}</p><p><b>Your answer:</b> ${got>=0?x.o[got]:'Not answered'}</p>${!ok?`<p><b>Correct answer:</b> ${x.o[x.a]}</p>`:''}<p class="muted"><b>Topic:</b> ${x.topic} • <b>Type:</b> ${x.type}</p></div>`}).join('');document.getElementById('app').innerHTML=`<div class="card"><span class="tag">CLASS ${String(id).padStart(3,'0')} RESULT</span><h1>Test Result</h1><div class="${passed?'ok':'bad'}"><h2>${score}/100 — ${passed?'PASS ✓':'FAIL ✗'}</h2><p><b>${correct}/20</b> correct • ${20-correct} incorrect • ${auto?'Time expired.':'Submitted successfully.'}</p><p>${passed?'Congratulations — the next class is now unlocked.':'You need at least 90% (18/20) to unlock the next class.'}</p></div><h2>Question Review</h2>${reviews}<div class="btnrow"><button class="btn" onclick="restTest()">↻ REST — NEW QUESTIONS</button><a class="btn" href="data-science-master-v4.html#${id}">Back to Class</a></div></div>`}
function restTest(){clearInterval(timer);submitted=false;newSet();remaining=1200;renderExam();timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);submit(true)}},1000)}
renderStart();
</script></body></html>
