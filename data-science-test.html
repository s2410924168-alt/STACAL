<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastery Test — Statistical Hub</title><link rel="stylesheet" href="style.css"><style>main{padding:28px 0 70px}.card,.q{background:#fff;border:1px solid #dfe6ef;border-radius:15px;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-size:25px;font-weight:900}.q{margin:12px 0}.q label{display:block;padding:8px;border-radius:8px}.q label:hover{background:#f3f6fb}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.danger{background:#b42318!important}.ok{padding:15px;border-radius:12px;background:#effcf4;border:1px solid #9ddbb7}.bad{padding:15px;border-radius:12px;background:#fff1f1;border:1px solid #efb1b1}.muted{color:#667085}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef3ff;color:#2458a6;font-weight:800;font-size:11px}@media(max-width:700px){.timer{font-size:20px}}</style></head><body><header class="header"><a class="brand" href="index.html"><span class="logo">Σ</span><span>Statistical <b>Hub</b></span></a><button class="menu-btn">☰</button></header><nav class="menu"><a href="data-science-academy.html">🧠 Academy</a><a href="data-science-master-v4.html">📘 Course</a></nav><main class="container"><div id="app"></div></main><script src="data-science-master-content.js"></script><script>
const params=new URLSearchParams(location.search), id=Math.max(1,Math.min(200,+params.get('class')||1));
const titles=['Research & Research Design','Mathematics, Probability & Statistical Foundations','Excel for Research & Data Analysis','R Programming & Statistical Research','Python Programming & Data Science','SQL & Data Management','SPSS for Academic Research','Additional Research Software & Power','Visualization, Communication & BI','Advanced Statistics & Research Analysis','SEM, Measurement & SmartPLS','Machine Learning, AI & Capstone Research'];
const lists=[['Research fundamentals','Research problems and gaps','Questions and objectives','Hypotheses and propositions','Variables and constructs','Measurement and coding','Experimental/observational designs','Population and sampling frame','Probability sampling','Non-probability sampling and bias','Data sources and provenance','Ethics and reproducibility'],['Algebra','Functions and transformations','Exponents and logarithms','Summation notation','Differentiation and optimization','Partial derivatives and gradients','Matrices','Vectors and geometry','Linear systems','Eigenvalues/eigenvectors','Descriptive statistics and moments','Combinatorics and conditional probability','Random variables and expectation','Discrete distributions','Continuous distributions','Joint/marginal/conditional distributions','Covariance/correlation','Likelihood and MLE'],['Research setup','Data validation','Formulas/references','Logical functions','Text cleaning','Dates/time','XLOOKUP and INDEX-MATCH','Conditional aggregation','Sort/filter/duplicates','Tables','Pivot Tables','Pivot Charts','Descriptive statistics','Correlation/covariance','Simple regression','Multiple regression','ANOVA/post-hoc','Power Query','Power Pivot/data models','Research dashboard'],['R/RStudio','Vectors/operators','Matrices/lists','Data frames/factors','Functions/vectorization','Packages/environments','Import/export','Base R cleaning','dplyr','Joins','tidyr','Dates','ggplot2','Descriptive statistics','Probability simulation','Distributions','Sampling/confidence intervals','Hypothesis testing','Correlation','Regression','ANOVA','Non-parametric methods','Multivariate methods','Diagnostics','R Markdown/Quarto project'],['Python/Jupyter','Variables/types','Data structures','Conditions/loops','Functions/modules','NumPy','NumPy linear algebra','Pandas','Import CSV/Excel/JSON/SQL','Cleaning/types','Missing data','Outliers','Feature engineering','Groupby/merge/reshape','Matplotlib','Seaborn','EDA','Inference','Regression/statsmodels','scikit-learn workflow','Train/validation/test','Cross-validation/pipelines','Regularization/feature selection','Hyperparameter tuning','Complete Python project'],['Database concepts','Keys and relationships','SELECT/WHERE','ORDER/DISTINCT/NULL','GROUP BY/aggregates','HAVING','JOINs','Multi-table research queries','Subqueries','CTEs','CASE','Dates/cohorts','Window functions','Data quality/constraints','Normalization/indexes/performance','SQL project'],['SPSS setup','Variable/Data View','Coding/labels/recoding','Missing values','Descriptives/Explore','Crosstabs/chi-square','Independent t-test','Paired t-test','One-way ANOVA/effect/post-hoc','Two-way ANOVA','ANCOVA','Correlation/partial correlation','Linear regression','Diagnostics','Non-parametric tests','Logistic regression','Factor/PCA','Academic reporting/syntax'],['Stata workflow','Stata data management','Stata descriptive analysis','Stata regression','Stata diagnostics/panel','EViews econometrics','Jamovi','JASP','G*Power','Cross-software verification'],['Visualization principles','Research figures','Dashboard storytelling','Power BI/import','Power Query','Data models/star schema','DAX/filter context','KPIs/interactions','Tableau dashboards','Publication-quality visualization'],['Estimation/confidence intervals','Power/sample size','Hypothesis testing/multiple comparisons','Effect sizes','ANOVA families','LSD/Tukey/Bonferroni/DMRT','Partial/rank correlation','Multiple regression','Regression diagnostics','Multicollinearity/influence','Logistic regression','GLM concepts','PCA','Factor analysis','Cluster analysis','Advanced statistics project'],['SEM foundations','Constructs/indicators','Reflective models','Formative models','Reliability/validity','PLS-SEM measurement','Structural model/R²/f²/predictive relevance','Bootstrapping/hypotheses','Mediation/moderation/multi-group','End-to-end PLS-SEM project'],['ML problem framing','Supervised vs unsupervised','Data leakage','Feature engineering','Baselines/evaluation','Predictive regression','Ridge/Lasso/Elastic Net','Logistic classification','Decision trees','Random forests','Gradient boosting','kNN','SVM','Naive Bayes','k-means/hierarchical clustering','Dimensionality reduction','Imbalanced data/metrics','Hyperparameter tuning','Interpretation/fairness/responsible AI','End-to-end capstone and final defense']];
let C=[],n=1;lists.forEach((a,p)=>a.forEach(title=>C.push({id:n++,title,phase:p})));const c=C[id-1];
function bank(c){let t=c.title, base=[{type:'Theory',q:`Which statement best describes the main purpose of ${t}?`,o:['Match the research question and data to a defensible analytical workflow.','Always maximize the sample mean.','Avoid documenting assumptions.','Treat every dataset identically.'],a:0},{type:'Research',q:`A researcher applies ${t} to a study dataset. What should happen before the final conclusion?`,o:['Check data, assumptions/validity and interpret in substantive context.','Delete inconvenient observations automatically.','Report only the p-value.','Claim causation from any association.'],a:0},{type:'Programming',q:'What is the best practice for reproducible analysis?',o:['Save the code, data-processing decisions and software/version information.','Change results manually in the output.','Use undocumented transformations.','Copy numbers into the paper without checking.'],a:0},{type:'Mathematical',q:'If an estimate is θ̂ and its standard error is SE(θ̂), which expression has the standard form of a large-sample 95% confidence interval?',o:['θ̂ ± 1.96 SE(θ̂)','θ̂ ± SE(θ̂)/1.96','θ̂ × SE(θ̂)','1.96/θ̂'],a:0},{type:'Data',q:'Which action most directly reduces the risk of data leakage in predictive modeling?',o:['Fit preprocessing only on training data within the resampling workflow.','Scale the full dataset before splitting.','Choose features using the test set.','Tune hyperparameters on the final test set.'],a:0}];let out=[];for(let i=0;i<50;i++){let x=base[i%base.length];out.push({type:x.type,q:`${i+1}. ${x.q}`,o:[...x.o],a:x.a,topic:t});}return out}
let all=bank(c), prev=[];try{prev=JSON.parse(localStorage.getItem('stacal_ds_test_sets')||'[]')}catch(e){}let seed=(Date.now()+id*997)%all.length;let chosen=[];for(let i=0;i<20;i++)chosen.push(all[(seed+i*7)%all.length]);chosen=chosen.map((x,i)=>{let opts=x.o.map((v,j)=>({v,j})).sort(()=>Math.random()-.5);return {...x,o:opts.map(z=>z.v),a:opts.findIndex(z=>z.j===x.a),num:i+1}});let started=false,remaining=1200,timer;
function saveAttempt(score){let s={};try{s=JSON.parse(localStorage.getItem('stacal_ds_master_final')||'{}')}catch(e){}let old=s[id]||{attempts:0,best:0};let passed=score>=90;s[id]={attempts:(old.attempts||0)+1,best:Math.max(old.best||0,score),latest:score,passed:old.passed||passed,last:new Date().toISOString()};localStorage.setItem('stacal_ds_master_final',JSON.stringify(s));return passed}
function renderStart(){document.getElementById('app').innerHTML=`<div class="card"><span class="tag">CLASS ${String(id).padStart(3,'0')}</span><h1>${c.title}</h1><p class="muted">20 questions • 100 marks • 20 minutes • Pass ≥ 90%</p><p>This test contains theory + mathematical + programming + research/data interpretation questions.</p><button class="btn" onclick="start()">▶ START TEST</button> <a class="btn" href="data-science-master-v4.html#${id}">Back to Class</a></div>`}
function start(){started=true;remaining=1200;renderExam();timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);submit(true)}},1000)}
function updateTimer(){let e=document.getElementById('timer');if(e){let m=Math.floor(remaining/60),s=remaining%60;e.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}}
function renderExam(){document.getElementById('app').innerHTML=`<div class="card"><div class="top"><div><span class="tag">CLASS ${String(id).padStart(3,'0')}</span><h2>${c.title}</h2></div><div class="timer" id="timer">20:00</div></div><p class="muted">Answer all 20 questions. Passing score: 90/100.</p><form id="exam">${chosen.map((x,i)=>`<div class="q"><b>Q${i+1}. [${x.type}]</b><p>${x.q.replace(/^\d+\. /,'')}</p>${x.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<div class="btnrow"><button class="btn" type="button" onclick="submit(false)">✓ SUBMIT TEST</button><button class="btn danger" type="button" onclick="resetTest()">↻ REST — NEW QUESTIONS</button></div></form></div>`;updateTimer()}
function submit(auto){clearInterval(timer);let correct=0;chosen.forEach((x,i)=>{let el=document.querySelector(`input[name=q${i}]:checked`);if(el&&+el.value===x.a)correct++});let score=correct*5,passed=saveAttempt(score);document.getElementById('app').innerHTML=`<div class="card"><h1>Test Result</h1><div class="${passed?'ok':'bad'}"><h2>${score}/100 — ${passed?'PASS ✓':'FAIL ✗'}</h2><p>${correct}/20 correct. ${passed?'Next class is now unlocked.':'You need at least 90% to unlock the next class.'}</p></div><p><b>Time:</b> ${auto?'Time expired.':'Submitted by you.'}</p><div class="btnrow"><button class="btn" onclick="resetTest()">↻ REST — NEW QUESTIONS</button><a class="btn" href="data-science-master-v4.html#${id}">Back to Class</a></div></div>`}
function resetTest(){location.href='data-science-test.html?class='+id+'&reset='+Date.now()}
renderStart();
</script></body></html>
