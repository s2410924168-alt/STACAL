<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mastery Test — Statistical Hub</title><link rel="stylesheet" href="style.css">
<style>
main{padding:28px 0 70px}.card,.q{background:#fff;border:1px solid #dfe6ef;border-radius:15px;padding:18px}.q{margin:12px 0}.q label{display:block;padding:9px;border-radius:8px;line-height:1.45}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-size:28px;font-weight:900}.warn{color:#b42318}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.danger{background:#b42318!important}.ok{padding:15px;border-radius:12px;background:#effcf4;border:1px solid #9ddbb7}.bad{padding:15px;border-radius:12px;background:#fff1f1;border:1px solid #efb1b1}.review{padding:12px;border:1px solid #e1e7ef;border-radius:10px;margin:10px 0}.correct{border-left:4px solid #178a4b}.wrong{border-left:4px solid #b42318}.muted{color:#667085}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef3ff;color:#2458a6;font-weight:800;font-size:11px}.result-score{font-size:48px;font-weight:900;margin:8px 0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid #e1e7ef;border-radius:10px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}@media(max-width:700px){.timer{font-size:22px}.statgrid{grid-template-columns:1fr}}
</style></head>
<body><header class="header"><a class="brand" href="index.html"><span class="logo">Σ</span><span>Statistical <b>Hub</b></span></a><button class="menu-btn">☰</button></header>
<nav class="menu"><a href="data-science-academy.html">🧠 Academy</a><a href="data-science-master-v4.html">📘 Course</a></nav>
<main class="container"><div id="app"></div></main>
<script src="data-science-phase1-questions.js"></script>
<script>
const lists=[["Perception of Research","Assortment of a Problem","Appraise of Related Literature","Foundation of Hypothesis","Research Planning and Sampling","Survey Method","Historical Method","Philosophical Method","Experimental Method","Case Study Method","Genetic Method","Design of Experiments","Tools of Research","Collection of Data","Analysis of Data","Research Report","Action Research","Organisation of Statistical Data","Measures of Central Tendency","Measures of Variability","Correlation"],["Algebra","Functions and transformations","Exponents and logarithms","Summation notation","Differentiation and optimization","Partial derivatives and gradients","Matrices","Vectors and geometry","Linear systems","Eigenvalues/eigenvectors","Descriptive statistics and moments","Combinatorics and conditional probability","Random variables and expectation","Discrete distributions","Continuous distributions","Joint/marginal/conditional distributions","Covariance/correlation","Likelihood and MLE"],["Research setup","Data validation","Formulas/references","Logical functions","Text cleaning","Dates/time","XLOOKUP and INDEX-MATCH","Conditional aggregation","Sort/filter/duplicates","Tables","Pivot Tables","Pivot Charts","Descriptive statistics","Correlation/covariance","Simple regression","Multiple regression","ANOVA/post-hoc","Power Query","Power Pivot/data models","Research dashboard"],["R/RStudio","Vectors/operators","Matrices/lists","Data frames/factors","Functions/vectorization","Packages/environments","Import/export","Base R cleaning","dplyr","Joins","tidyr","Dates","ggplot2","Descriptive statistics","Probability simulation","Distributions","Sampling/confidence intervals","Hypothesis testing","Correlation","Regression","ANOVA","Non-parametric methods","Multivariate methods","Diagnostics","R Markdown/Quarto project"],["Python/Jupyter","Variables/types","Data structures","Conditions/loops","Functions/modules","NumPy","NumPy linear algebra","Pandas","Import CSV/Excel/JSON/SQL","Cleaning/types","Missing data","Outliers","Feature engineering","Groupby/merge/reshape","Matplotlib","Seaborn","EDA","Inference","Regression/statsmodels","scikit-learn workflow","Train/validation/test","Cross-validation/pipelines","Regularization/feature selection","Hyperparameter tuning","Complete Python project"],["Database concepts","Keys and relationships","SELECT/WHERE","ORDER/DISTINCT/NULL","GROUP BY/aggregates","HAVING","JOINs","Multi-table research queries","Subqueries","CTEs","CASE","Dates/cohorts","Window functions","Data quality/constraints","Normalization/indexes/performance","SQL project"],["SPSS setup","Variable/Data View","Coding/labels/recoding","Missing values","Descriptives/Explore","Crosstabs/chi-square","Independent t-test","Paired t-test","One-way ANOVA/effect/post-hoc","Two-way ANOVA","ANCOVA","Correlation/partial correlation","Linear regression","Diagnostics","Non-parametric tests","Logistic regression","Factor/PCA","Academic reporting/syntax"],["Stata workflow","Stata data management","Stata descriptive analysis","Stata regression","Stata diagnostics/panel","EViews econometrics","Jamovi","JASP","G*Power","Cross-software verification"],["Visualization principles","Research figures","Dashboard storytelling","Power BI/import","Power Query","Data models/star schema","DAX/filter context","KPIs/interactions","Tableau dashboards","Publication-quality visualization"],["Estimation/confidence intervals","Power/sample size","Hypothesis testing/multiple comparisons","Effect sizes","ANOVA families","LSD/Tukey/Bonferroni/DMRT","Partial/rank correlation","Multiple regression","Regression diagnostics","Multicollinearity/influence","Logistic regression","GLM concepts","PCA","Factor analysis","Cluster analysis","Advanced statistics project"],["SEM foundations","Constructs/indicators","Reflective models","Formative models","Reliability/validity","PLS-SEM measurement","Structural model/R²/f²/predictive relevance","Bootstrapping/hypotheses","Mediation/moderation/multi-group","End-to-end PLS-SEM project"],["ML problem framing","Supervised vs unsupervised","Data leakage","Feature engineering","Baselines/evaluation","Predictive regression","Ridge/Lasso/Elastic Net","Logistic classification","Decision trees","Random forests","Gradient boosting","kNN","SVM","Naive Bayes","k-means/hierarchical clustering","Dimensionality reduction","Imbalanced data/metrics","Hyperparameter tuning","Interpretation/fairness/responsible AI","End-to-end capstone and final defense"]];
let C=[],n=1;lists.forEach((titles,pi)=>titles.forEach(title=>C.push({id:n++,title,phase:pi})));
const TOTAL=C.length,rawId=Number(new URLSearchParams(location.search).get('class')),id=Number.isInteger(rawId)&&rawId>0?rawId:1,c=C[id-1];
const app=document.getElementById('app');
const state=()=>{try{return JSON.parse(localStorage.getItem('stacal_ds_master_final')||'{}')}catch(e){return {}}};
const unlocked=i=>i===1||!!state()[i-1]?.passed;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const book=id<=21?'Fundamental of Research Methodology and Statistics — Yogesh Kumar Singh':'Recommended course reference';
let chosen=[],remaining=1200,timer=null,submitted=false,seed=Number(localStorage.getItem('stacal_test_seed_'+id)||0);
function rng(s){let x=s>>>0;return()=>((x=x*1664525+1013904223>>>0)/4294967296)}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fallbackBank(){return Array.from({length:40},(_,i)=>({type:i%3===0?'Theory':i%3===1?'Application':'Math',q:'Which practice is most appropriate for '+c.title+'?',options:['Use evidence and a documented method aligned with the research objective.','Choose a method without considering the objective.','Ignore assumptions and data quality.','Change the conclusion to fit expectations.'],answer:0,topic:c.title}))}
function buildSet(){const r=rng((Date.now()+id*1009+(++seed)*9176)>>>0);localStorage.setItem('stacal_test_seed_'+id,seed);let pool=id<=21?(window.DS_PHASE1_BANK[id]||[]):fallbackBank();pool=shuffle(pool.slice(),r);return pool.slice(0,20).map(x=>{let opts=x.options.map((v,j)=>({v,j}));shuffle(opts,r);return{type:x.type,q:x.q,o:opts.map(z=>z.v),a:opts.findIndex(z=>z.j===x.answer),topic:x.topic}})}
function save(score,correct){let s=state(),old=s[id]||{},pass=score>=90;s[id]={attempts:(old.attempts||0)+1,best:Math.max(Number(old.best)||0,score),latest:score,passed:!!old.passed||pass,last:new Date().toISOString(),lastCorrect:correct};localStorage.setItem('stacal_ds_master_final',JSON.stringify(s));return pass}
function tick(){const e=document.getElementById('timer');if(e){e.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(remaining<=120)e.classList.add('warn')}}
function start(){clearInterval(timer);chosen=buildSet();remaining=1200;submitted=false;renderExam();timer=setInterval(()=>{remaining--;tick();if(remaining<=0){clearInterval(timer);submitTest(true)}},1000)}
function renderStart(){app.innerHTML='<div class="card"><span class="tag">CLASS '+String(id).padStart(3,'0')+'</span><h1>'+esc(c.title)+'</h1><p class="muted">Reference: <b>'+esc(book)+'</b></p><p><b>20 questions • 100 marks • 20 minutes • Pass ≥ 90% (18/20)</b></p><p>Phase 1 questions are based on the uploaded Yogesh Kumar Singh book.</p><div class="btnrow"><button class="btn" id="startBtn" type="button">▶ START TEST</button><a class="btn" href="data-science-master-v4.html#'+id+'">Back to Class</a></div></div>';document.getElementById('startBtn').onclick=start}
function renderExam(){app.innerHTML='<div class="card"><div class="top"><div><span class="tag">CLASS '+String(id).padStart(3,'0')+'</span><h2>'+esc(c.title)+'</h2></div><div class="timer" id="timer">20:00</div></div><p class="muted">20 questions × 5 marks = 100</p><form id="exam">'+chosen.map((x,i)=>'<div class="q"><b>Q'+(i+1)+'. ['+esc(x.type)+']</b><p>'+esc(x.q)+'</p>'+x.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</div>').join('')+'<div class="btnrow"><button class="btn" id="submitBtn" type="button">✓ SUBMIT TEST</button><button class="btn danger" id="restBtn" type="button">↻ REST — NEW QUESTIONS</button></div></form></div>';tick();document.getElementById('submitBtn').onclick=()=>submitTest(false);document.getElementById('restBtn').onclick=resetTest}
function submitTest(auto){if(submitted)return;submitted=true;clearInterval(timer);let correct=0,answers=[];chosen.forEach((x,i)=>{const el=document.querySelector('input[name="q'+i+'"]:checked'),a=el?Number(el.value):null;answers.push(a);if(a===x.a)correct++});const score=correct*5,pass=save(score,correct);renderResult(score,correct,pass,answers,auto)}
function renderResult(score,correct,pass,answers,auto){const next=id<TOTAL?id+1:null;app.innerHTML='<div class="card"><span class="tag">TEST RESULT</span><h1>Class '+String(id).padStart(3,'0')+' — '+esc(c.title)+'</h1><div class="result-score">'+score+' / 100</div><div class="statgrid"><div class="stat"><b>'+correct+'/20</b>Correct</div><div class="stat"><b>'+(20-correct)+'/20</b>Wrong / Unanswered</div><div class="stat"><b>'+(pass?'PASS':'FAIL')+'</b>'+(pass?'90%+ achieved':'Need 18 correct')+'</div></div><p>'+(auto?'⏱️ Time expired — automatically submitted.':'')+'</p><div class="'+(pass?'ok':'bad')+'"><h2>'+(pass?'🎉 PASSED — NEXT CLASS UNLOCKED':'❌ NOT PASSED')+'</h2><p>'+(pass?(next?'Class '+String(next).padStart(3,'0')+' is now unlocked.':'Final class completed.'):'You need at least 90% (18/20) to unlock the next class.')+'</p></div><div class="btnrow"><button class="btn" id="resultRest" type="button">↻ REST — NEW QUESTIONS</button><a class="btn" href="data-science-master-v4.html#'+(pass&&next?next:id)+'">'+(pass&&next?'Go to Next Class':'Back to Class')+'</a></div><h2>Question Review</h2>'+chosen.map((x,i)=>'<div class="review '+(answers[i]===x.a?'correct':'wrong')+'"><b>Q'+(i+1)+'. '+esc(x.type)+'</b><p>'+esc(x.q)+'</p><p>Your answer: <b>'+(answers[i]===null?'Not answered':esc(x.o[answers[i]]))+'</b></p>'+(answers[i]!==x.a?'<p>Correct answer: <b>'+esc(x.o[x.a])+'</b></p>':'')+'<small class="muted">Topic: '+esc(x.topic)+'</small></div>').join('')+'</div>';document.getElementById('resultRest').onclick=resetTest}
function resetTest(){start()}
if(!c)app.innerHTML='<div class="card"><h1>Invalid Class</h1><p>Total classes: '+TOTAL+'</p></div>';else if(!unlocked(id))app.innerHTML='<div class="card"><h1>🔒 Test Locked</h1><p>Pass Class '+String(id-1).padStart(3,'0')+' with at least 90% first.</p><a class="btn" href="data-science-master-v4.html#'+(id-1)+'">Back to Previous Class</a></div>';else renderStart();
</script></body></html>
