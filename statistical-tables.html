function lg(z){const c=[676.5203681218851,-1259.1390294,771.323428777653,-176.6150291621406,12.5073432786869,-.13857109526572,9.98436957801957e-6,1.50563273514931e-7];if(z<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-lg(1-z);z-=1;let x=.9999999999998099;for(let i=0;i<c.length;i++)x+=c[i]/(z+i+1);let t=z+c.length-.5;return .5*Math.log(2*Math.PI)+(z+.5)*Math.log(t)-t+Math.log(x)}
function bc(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=300;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;let del=d*c;h*=del;if(Math.abs(del-1)<3e-10)break}return h}
function ib(x,a,b){if(x<=0)return 0;if(x>=1)return 1;let bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bc(a,b,x)/a:1-bt*bc(b,a,1-x)/b}
function tcdf(t,df){let x=df/(df+t*t),q=ib(x,df/2,.5);return t>=0?1-.5*q:.5*q}
function bis(fn,lo,hi){for(let i=0;i<90;i++){let m=(lo+hi)/2;if(fn(m)>0)hi=m;else lo=m}return(lo+hi)/2}
function tinv(p,df){if(p<.5)return-tinv(1-p,df);return bis(x=>tcdf(x,df)-p,0,50)}
function gcdf(x,a){if(x<=0)return 0;let gl=lg(a);if(x<a+1){let sum=1/a,del=sum;for(let n=1;n<500;n++){del*=x/(a+n);sum+=del;if(Math.abs(del)<Math.abs(sum)*3e-12)break}return sum*Math.exp(-x+a*Math.log(x)-gl)}let b=x+1-a,c=1e30,d=1/b,h=d;for(let i=1;i<500;i++){let an=-i*(i-a),bn=b+2*i;d=an*d+bn;if(Math.abs(d)<1e-30)d=1e-30;c=bn+an/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;let del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return 1-Math.exp(-x+a*Math.log(x)-gl)*h}
function chicdf(x,df){return gcdf(x/2,df/2)}function chiinv(p,df){return bis(x=>chicdf(x,df)-p,0,df+20*Math.sqrt(2*df)+100)}
function fcdf(x,d1,d2){return x<=0?0:ib(d1*x/(d1*x+d2),d1/2,d2/2)}function finv(p,d1,d2){return bis(x=>fcdf(x,d1,d2)-p,0,1e4)}
function logchoose(n,k){return lg(n+1)-lg(k+1)-lg(n-k+1)}function pmf(n,p,k){if(k<0||k>n)return 0;if(p===0)return k===0?1:0;if(p===1)return k===n?1:0;return Math.exp(logchoose(n,k)+k*Math.log(p)+(n-k)*Math.log1p(-p))}
function cdfbin(n,p,k){let s=0;for(let i=0;i<=k;i++)s+=pmf(n,p,i);return Math.min(1,s)}
function runsDist(n1,n2){let d=new Map(),K=(a,b,r,l)=>a+','+b+','+r+','+l;if(n1)d.set(K(1,0,1,1),1);if(n2)d.set(K(0,1,1,2),1);for(let a=0;a<=n1;a++)for(let b=0;b<=n2;b++)for(let r=1;r<=n1+n2;r++)for(let l=1;l<=2;l++){let cur=d.get(K(a,b,r,l))||0;if(!cur)continue;if(l===1&&a<n1)d.set(K(a+1,b,r,1),(d.get(K(a+1,b,r,1))||0)+cur);if(l===1&&b<n2)d.set(K(a,b+1,r+1,2),(d.get(K(a,b+1,r+1,2))||0)+cur);if(l===2&&b<n2)d.set(K(a,b+1,r,2),(d.get(K(a,b+1,r,2))||0)+cur);if(l===2&&a<n1)d.set(K(a+1,b,r+1,1),(d.get(K(a+1,b,r+1,1))||0)+cur)}let o=new Map(),tot=0;for(let [kk,c] of d){let [a,b,r,l]=kk.split(',').map(Number);if(a===n1&&b===n2){o.set(r,(o.get(r)||0)+c);tot+=c}}for(let [r,c] of o)o.set(r,c/tot);return o}
function runcrit(n1,n2,a){let d=runsDist(n1,n2),rs=[...d.keys()].sort((a,b)=>a-b),tail=a/2,c=0,lo=rs[0],up=rs[rs.length-1];for(let r of rs){c+=d.get(r);if(c<=tail+1e-12)lo=r;else break}c=0;for(let i=rs.length-1;i>=0;i--){let r=rs[i];c+=d.get(r);if(c<=tail+1e-12)up=r;else break}return[lo,up]}
function wilcoxon(n,a){let dp=[1];for(let r=1;r<=n;r++){let nd=Array(dp.length+r).fill(0);for(let i=0;i<dp.length;i++){nd[i]+=dp[i];nd[i+r]+=dp[i]}dp=nd}let tot=2**n,tail=a/2,c=0,lo=0;for(let w=0;w<dp.length;w++){c+=dp[w]/tot;if(c<=tail+1e-12)lo=w;else break}return lo}
function mannDist(n1,n2){let dp=Array.from({length:n1+1},()=>Array.from({length:n2+1},()=>null));dp[0][0]=[1];for(let i=0;i<=n1;i++)for(let j=0;j<=n2;j++){let cur=dp[i][j];if(!cur)continue;if(i<n1){let t=dp[i+1][j]||(dp[i+1][j]=[]);for(let u=0;u<cur.length;u++)t[u+j]=(t[u+j]||0)+cur[u]}if(j<n2){let t=dp[i][j+1]||(dp[i][j+1]=[]);for(let u=0;u<cur.length;u++)t[u]=(t[u]||0)+cur[u]}}return dp[n1][n2]}
function manncrit(n1,n2,a){let d=mannDist(n1,n2),tot=d.reduce((s,x)=>s+(x||0),0),c=0,lo=0;for(let u=0;u<d.length;u++){c+=(d[u]||0)/tot;if(c<=a/2+1e-12)lo=u;else break}return lo}
function qval(k,df,a){let key=k+','+df+','+(1-a),z=REF.q[key];if(z!=null)return z;return Math.sqrt(2)*tinv(1-a/(2*k),df)}
function render(){
let k=S.value,h='';
let selected=tests.find(t=>t[2]===k);
document.getElementById('selectedTestName').innerHTML=selected
 ? 'Selected Test: <span>'+selected[0]+'. '+selected[1]+'</span>'
 : '';
if(['normalpdf','normalpos','normalneg','zfromr','rfromz','log'].includes(k))h=f('x','Input value','1.96');else if(k==='t')h=f('p','Cumulative probability p','0.975')+f('df','Degrees of freedom','26');else if(k==='chi')h=f('p','Cumulative probability p','0.95')+f('df','Degrees of freedom','10');else if(k==='f95'||k==='f99')h=f('df1','Numerator df','1')+f('df2','Denominator df','26');else if(k==='duncan1'||k==='duncan5')h=f('groups','Number of groups','5')+f('df','Error df','20')+f('alpha','Significance level',k==='duncan1'?'0.01':'0.05');else if(k==='dw')h=f('n','Observations','30')+f('k','Predictors','2')+f('d','Observed d (optional)','2.00');else if(k==='ks1')h=f('n','Sample size n','30')+f('alpha','Significance level','0.05');else if(k==='ks2one'||k==='ks2two')h=f('n1','Sample size n₁','20')+f('n2','Sample size n₂','20')+f('alpha','Significance level','0.05');else if(k==='corr')h=f('n','Sample size n','30')+f('alpha','Significance level','0.05');else if(k==='spearman')h=f('n','Sample size n','8')+f('alpha','Significance level','0.05');else if(k==='binomtest')h=f('n','Trials n','20')+f('p','Null probability p','0.5')+f('x','Observed successes k','10');else if(k==='binom')h=f('n','Trials n','10')+f('p','Probability p','0.5')+f('x','Successes k','5');else if(k==='runs')h=f('n1','Below-median count n₁','5')+f('n2','Above-median count n₂','5')+f('alpha','Significance level','0.05');else if(k==='wilcoxon')h=f('n','Number of non-zero pairs','10')+f('alpha','Significance level','0.05');else if(k==='mann')h=f('n1','Sample size n₁','8')+f('n2','Sample size n₂','8')+f('alpha','Significance level','0.05');else if(k==='kw')h=f('groups','Number of groups','4')+f('alpha','Significance level','0.05');else if(k==='dfuller')h=f('model','Model','Intercept only',['No constant','Intercept only','Intercept + trend'])+f('alpha','Significance level','0.05');else if(k==='samplesize')h=f('confidence','Confidence','0.95',['0.90','0.95','0.99'])+f('e','Margin of error','0.05')+f('p','Expected proportion','0.5');else if(k==='random')h=f('count','Number of values','10');document.getElementById('inputs').innerHTML=h;document.getElementById('result').innerHTML=''}
function out(value,formula,comment,extra=''){document.getElementById('result').innerHTML='<div class="st-result"><div class="st-note">Calculated / Reference value</div><div class="st-value">'+value+'</div>'+extra+'<div class="st-formula"><b>Formula / Rule:</b> '+formula+'<br><b>Comment:</b> '+comment+'</div></div>'}
function calc(){let k=S.value,x=+v('x'),a=+(v('alpha')||.05),value,formula,comment;
if(k==='normalpdf'){value=phi(x).toFixed(6);formula='φ(z)=exp(−z²/2)/√(2π)';comment='Standard normal ordinate.'}
else if(k==='normalpos'){value=(Phi(Math.abs(x))-.5).toFixed(6);formula='P(0<Z<z)=Φ(z)−0.5';comment='Area between 0 and positive z.'}
else if(k==='normalneg'){value=Phi(x).toFixed(6);formula='P(Z<z)=Φ(z)';comment='Cumulative probability for negative z.'}
else if(k==='t'){let p=+v('p'),df=+v('df'),r=REF.t[df]?.[p];value=(r??tinv(p,df)).toFixed(6);formula='Find t with P(T≤t)=p';comment='Accurate Student t percentile.'}
else if(k==='chi'){let p=+v('p'),df=+v('df'),r=REF.chi[df]?.[p];value=(r??chiinv(p,df)).toFixed(6);formula='Find χ² with P(X≤χ²)=p';comment='Accurate chi-square percentile.'}
else if(k==='f95'||k==='f99'){let d1=+v('df1'),d2=+v('df2'),p=k==='f95'?.95:.99,r=REF.f[d1+','+d2]?.[p];value=(r??finv(p,d1,d2)).toFixed(6);formula='Find F with P(F≤Fcrit)=p';comment='Accurate upper F percentile.'}
else if(k==='duncan1'||k==='duncan5'){let g=+v('groups'),df=+v('df'),alpha=+v('alpha'),rows=[];for(let p=2;p<=g;p++){let adj=1-Math.pow(1-alpha,p-1),q=qval(p,df,adj);rows.push('<tr><td>'+p+'</td><td>'+adj.toFixed(6)+'</td><td>'+q.toFixed(4)+'</td><td>'+Math.sqrt(2)+'</td></tr>')}out('Duncan range q sequence','αp=1−(1−α)^(p−1); SR=q√(MSE/r)','Exact/reference q values are used where embedded; otherwise a conservative browser fallback is shown.','<table class="st-table"><tr><th>p</th><th>Adjusted α</th><th>q</th><th>√2 factor</th></tr>'+rows.join('')+'</table>');return}
else if(k==='dw'){let d=+v('d');value='Observed d = '+d.toFixed(4);formula='d=Σ(eᵢ−eᵢ₋₁)²/Σeᵢ²';comment='The exact dL and dU table bounds require the published Durbin-Watson reference table for the chosen n and number of regressors. The page now avoids inventing a false critical value.'}
else if(k==='ks1'){let n=+v('n'),r=REF.ks1[n]?.[a];if(r==null){let c=a<=.01?1.63:a<=.05?1.36:1.22;r=c/Math.sqrt(n)}else r=r;value=r.toFixed(6);formula='Finite-sample one-sample KS critical value';comment='Exact tabulated finite-n value is embedded for n≤200.'}
else if(k==='ks2one'||k==='ks2two'){let n1=+v('n1'),n2=+v('n2'),c=a<=.01?1.63:a<=.05?1.36:1.22;value=(c*Math.sqrt((n1+n2)/(n1*n2))).toFixed(6);formula='Dcrit≈c(α)√((n₁+n₂)/(n₁n₂))';comment='Large-sample two-sample KS critical approximation.'}
else if(k==='corr'){let n=+v('n'),df=n-2,t=tinv(1-a/2,df);value=(t/Math.sqrt(t*t+df)).toFixed(6);formula='rcrit=tcrit/√(tcrit²+df)';comment='Pearson correlation critical value from the exact t distribution.'}
else if(k==='zfromr'){value=(.5*Math.log((1+x)/(1-x))).toFixed(6);formula='z=0.5 ln[(1+r)/(1−r)]';comment='Fisher transformation.'}
else if(k==='rfromz'){value=Math.tanh(x).toFixed(6);formula='r=tanh(z)';comment='Inverse Fisher transformation.'}
else if(k==='spearman'){let n=+v('n'),r=REF.spearmanSmall[n]?.[a];if(r==null){let t=tinv(1-a/2,n-2);r=t/Math.sqrt(t*t+n-2)}value=r.toFixed(6);formula='Exact permutation critical value for small n; t approximation for larger n';comment='Small-sample values use exact permutation enumeration.'}
else if(k==='binomtest'){let n=+v('n'),p=+v('p'),kk=+v('x');value=cdfbin(n,p,kk).toFixed(8);formula='P(X≤k)=Σ C(n,x)pˣ(1−p)ⁿ⁻ˣ';comment='Exact lower-tail binomial probability.'}
else if(k==='binom'){let n=+v('n'),p=+v('p'),kk=+v('x');value=pmf(n,p,kk).toFixed(8);formula='P(X=k)=C(n,k)pᵏ(1−p)ⁿ⁻ᵏ';comment='Exact binomial probability.'}
else if(k==='runs'){let n1=+v('n1'),n2=+v('n2');if(n1<=30&&n2<=30){let r=runcrit(n1,n2,a);value='Lower R = '+r[0]+' ; Upper R = '+r[1];formula='Exact combinatorial runs distribution';comment='Exact two-sided critical values.'}else{let n=n1+n2,mu=1+2*n1*n2/n,sd=Math.sqrt(2*n1*n2*(2*n1*n2-n1-n2)/(n*n*(n-1)));value=(mu-1.96*sd).toFixed(3)+' to '+(mu+1.96*sd).toFixed(3);formula='Normal approximation';comment='Used only for larger samples.'}}
else if(k==='wilcoxon'){let n=+v('n');value='T⁺ critical ≤ '+wilcoxon(n,a);formula='Exact signed-rank distribution';comment='Exact for n≤50.'}
else if(k==='mann'){let n1=+v('n1'),n2=+v('n2');if(n1<=20&&n2<=20)value='U critical ≤ '+manncrit(n1,n2,a);else{let N=n1+n2,mu=n1*n2/2,sd=Math.sqrt(n1*n2*(N+1)/12),z=inv(x=>Phi(x)-(1-a/2),-9,9);value=(mu-z*sd).toFixed(4)+' to '+(mu+z*sd).toFixed(4)}formula='Exact rank-sum distribution for small samples';comment='Exact U critical for n₁,n₂≤20.'}
else if(k==='kw'){let g=+v('groups');value=chiinv(1-a,g-1).toFixed(6);formula='χ² critical with df=k−1';comment='Standard large-sample Kruskal-Wallis reference.'}
else if(k==='dfuller'){let m=v('model');let c=m==='No constant'?(a<=.01?-2.58:a<=.05?-1.95:-1.62):m==='Intercept only'?(a<=.01?-3.43:a<=.05?-2.86:-2.57):(a<=.01?-3.96:a<=.05?-3.41:-3.13);value=c.toFixed(3);formula='Model-specific Dickey-Fuller critical value';comment='Asymptotic reference value.'}
else if(k==='samplesize'){let conf=+v('confidence'),e=+v('e'),p=+v('p'),z=inv(x=>Phi(x)-(1+conf)/2,-9,9);value=Math.ceil(z*z*p*(1-p)/(e*e));formula='n=z²p(1−p)/e²';comment='Simple-random-sample proportion approximation.'}
else if(k==='log'){value=Math.log10(x).toFixed(4);formula='log₁₀(x)';comment='Four-place common logarithm.'}
else if(k==='random'){let n=Math.min(100,Math.max(1,+v('count'))),a1=[];for(let i=0;i<n;i++)a1.push(String(Math.floor(Math.random()*100)).padStart(2,'0'));value=a1.join('  ');formula='Random integer generation';comment='Generated values; not a fixed published table.'}
out(value,formula,comment)}
render();
</script></body></html>
