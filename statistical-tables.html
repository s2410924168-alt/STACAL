<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statistical Tables — Statistical Hub</title>
<link rel="stylesheet" href="style.css">
<style>
.st-wrap{max-width:1050px;margin:0 auto}
.st-card{background:#fff;border:1px solid #d8e0eb;border-radius:14px;padding:20px}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.st-field label{display:block;font-weight:700;margin-bottom:6px;color:#334155}
.st-field input,.st-field select{width:100%;padding:11px;border:1px solid #cfd8e3;border-radius:9px;font:inherit}
.st-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.st-result{margin-top:18px;border:1px solid #cfe0ff;background:#f6f9ff;border-radius:12px;padding:20px}
.st-value{font-size:32px;font-weight:800;color:#2563eb;margin:5px 0}
.st-note{color:#64748b;font-size:14px}
.st-formula{margin-top:14px;background:#f8fafc;border-left:4px solid #2563eb;padding:14px;border-radius:8px}
.st-tests{margin-top:20px}
.st-tests select{width:100%;padding:12px;border:1px solid #cfd8e3;border-radius:9px;font:inherit}
@media(max-width:700px){.st-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html"><span class="logo">Σ</span><span>Statistical <b>Hub</b></span></a>
<button class="menu-btn" aria-label="Open menu">☰</button></header>
<nav class="menu" aria-label="Main menu">
<a href="index.html">🏠 Home</a><a href="tools.html">📊 Statistical Tools</a><a href="distributions.html">🎲 Distributions</a><a href="statistical-tables.html">📚 Statistical Tables</a><a href="formulas.html">∑ Formulas</a><a href="about.html">ⓘ About</a>
</nav>

<main class="page"><div class="container st-wrap">
<div class="page-title"><div class="tag">REFERENCE</div><h1>Statistical Tables</h1>
<p>Select a test/table, enter only the required information, and get the requested value.</p></div>

<div class="st-card">
<div class="st-tests">
<label><b>Select Test / Table</b></label>
<select id="stTest" onchange="renderInputs()"></select>
</div>
<div id="stInputs" class="st-grid" style="margin-top:16px"></div>
<div class="st-actions"><button class="btn" onclick="calculateTableValue()">Find Value</button>
<button class="btn secondary" onclick="renderInputs()">Reset</button></div>
<div id="stResult"></div>
</div>
</div></main>
<footer class="footer"><span>Statistical Hub</span><span>Free • Interactive • Student Friendly</span></footer>

<script>
const TESTS=[
["Ordinates (Y) of the Standard Normal Curve","z"],
["Standard Normal Probability Table (Positive)","z"],
["Standard Normal Probability Table (Negative)","z"],
["Student's t Distribution","t"],
["Chi-Square Distribution","chi"],
["F Distribution — 95th Percentile","f95"],
["F Distribution — 99th Percentile","f99"],
["Duncan's Multiple Range Test — 1%","duncan1"],
["Duncan's Multiple Range Test — 5%","duncan5"],
["Durbin-Watson d Statistic","dw"],
["Kolmogorov-Smirnov One-Sample Test","ks1"],
["Kolmogorov-Smirnov Two-Sample — One Tailed","ks2"],
["Kolmogorov-Smirnov Two-Sample — Two Tailed","ks2"],
["Kolmogorov-Smirnov Two-Sample — Large Samples","ks2"],
["Correlation Coefficient — 5% and 1%","corr"],
["z in Terms of Correlation Coefficient r","zfromr"],
["Correlation Coefficient r in Terms of z","rfromz"],
["Spearman Rank Correlation rₛ","spearman"],
["Binomial Test — Exact Probabilities","binom"],
["Binomial Distribution","binom"],
["Runs Test — Critical Values","runs"],
["Wilcoxon Signed-Rank Test — T⁺","wilcoxon"],
["Wilcoxon-Mann-Whitney — W","mann"],
["Kruskal-Wallis — KW","kw"],
["Dickey-Fuller Unit Root Test","dfuller"],
["Required Sample Size","samplesize"],
["Four-Place Common Logarithms","log"],
["Table of Random Numbers","random"],
["Studentized Range (q) / Tukey HSD","q"]
];

const sel=document.getElementById("stTest");
TESTS.forEach((t,i)=>{const o=document.createElement("option");o.value=t[1];o.textContent=(String(i+1).padStart(2,"0"))+". "+t[0];sel.appendChild(o)});

function fld(id,label,value,opts){
 let s='<div class="st-field"><label>'+label+'</label>';
 if(opts) s+='<select id="'+id+'">'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select>';
 else s+='<input id="'+id+'" value="'+value+'">';
 return s+'</div>';
}
function renderInputs(){
 const k=sel.value; let h="";
 if(k==="t") h=fld("df","Degrees of Freedom (df)","26")+fld("alpha","Significance Level (α)","0.05",["0.10","0.05","0.025","0.01"])+fld("tail","Tail","Two-tailed",["Two-tailed","One-tailed"]);
 else if(k==="chi") h=fld("df","Degrees of Freedom (df)","10")+fld("alpha","Significance Level (α)","0.05",["0.10","0.05","0.01"]);
 else if(k==="f95"||k==="f99") h=fld("df1","Numerator df (df₁)","1")+fld("df2","Denominator df (df₂)","26")+fld("alpha","Significance Level (α)",k==="f95"?"0.05":"0.01");
 else if(k==="q") h=fld("groups","Number of groups (k)","4")+fld("df","Error df","20")+fld("alpha","Significance Level (α)","0.05",["0.05","0.01"]);
 else if(["corr","spearman"].includes(k)) h=fld("n","Sample size (n)","30")+fld("alpha","Significance Level (α)","0.05",["0.05","0.01"]);
 else if(k==="ks1") h=fld("n","Sample size (n)","30")+fld("alpha","Significance Level (α)","0.05",["0.05","0.01"]);
 else if(k==="ks2") h=fld("n1","Sample size n₁","20")+fld("n2","Sample size n₂","20")+fld("alpha","Significance Level (α)","0.05",["0.05","0.01"]);
 else if(["mann"].includes(k)) h=fld("n1","Sample size n₁","10")+fld("n2","Sample size n₂","10")+fld("alpha","Significance Level (α)","0.05",["0.05","0.01"]);
 else if(["wilcoxon","runs"].includes(k)) h=fld("n","Sample size (n)","10")+fld("alpha","Significance Level (α)","0.05",["0.05","0.01"]);
 else if(k==="dw") h=fld("n","Observations (n)","30")+fld("p","Number of predictors (k)","2");
 else if(k==="duncan1"||k==="duncan5") h=fld("groups","Number of groups","5")+fld("df","Error df","20")+fld("alpha","Significance Level (α)",k==="duncan1"?"0.01":"0.05");
 else if(k==="samplesize") h=fld("confidence","Confidence level","0.95",["0.90","0.95","0.99"])+fld("e","Margin of error","0.05");
 else if(k==="log") h=fld("x","Number (x)","10");
 else if(k==="random") h=fld("count","Number of random values","10");
 else if(k==="z"||k==="zfromr"||k==="rfromz") h=fld("x","Input value","1.96");
 else h=fld("x","Input value","1");
 document.getElementById("stInputs").innerHTML=h;
 document.getElementById("stResult").innerHTML="";
}
function val(id){return document.getElementById(id)?.value}
function calculateTableValue(){
 const k=sel.value; let out=""; let formula=""; let comment="";
 if(k==="t"){
   const map={"1-0.05-Two-tailed":"12.7062","2-0.05-Two-tailed":"4.3027","3-0.05-Two-tailed":"3.1824","4-0.05-Two-tailed":"2.7764","5-0.05-Two-tailed":"2.5706","26-0.05-Two-tailed":"2.0555"};
   out=map[val("df")+"-"+val("alpha")+"-"+val("tail")]||"Reference-table lookup required for this combination.";
   formula="t = (x̄ − μ₀)/(s/√n)"; comment="Critical t value depends on df, α and tail.";
 }else if(k==="chi"){
   const map={"1-0.05":"3.841","5-0.05":"11.070","10-0.05":"18.307","20-0.05":"31.410","26-0.05":"38.885"};
   out=map[val("df")+"-"+val("alpha")]||"Reference-table lookup required for this combination.";
   formula="χ² = Σ (O − E)²/E"; comment="Critical value depends on df and α.";
 }else if(k==="f95"||k==="f99"){
   const map={"1-26-0.05":"4.2252","1-10-0.05":"4.9646","2-26-0.05":"3.3690","3-26-0.05":"2.9912"};
   out=map[val("df1")+"-"+val("df2")+"-"+val("alpha")]||"Reference-table lookup required for this combination.";
   formula="F = MS₁/MS₂"; comment="F critical value depends on numerator df, denominator df and α.";
 }else if(k==="q"){
   const map={"4-20-0.05":"3.958","5-20-0.05":"4.232","4-20-0.01":"5.091"};
   out=map[val("groups")+"-"+val("df")+"-"+val("alpha")]||"Reference-table lookup required for this combination.";
   formula="HSD = q × √(MSE/r)"; comment="Studentized range q is used with Tukey HSD.";
 }else if(k==="ks1"){
   out=(1.36/Math.sqrt(+val("n"))).toFixed(4); formula="Dcrit ≈ Kα/√n"; comment="Demo uses the common 5% constant Kα ≈ 1.36.";
 }else if(k==="ks2"){
   out=(1.36*Math.sqrt((+val("n1")+ +val("n2"))/(+val("n1")*+val("n2")))).toFixed(4); formula="Dcrit ≈ Kα√((n₁+n₂)/(n₁n₂))"; comment="Demo uses the common 5% constant Kα ≈ 1.36.";
 }else if(k==="corr"){
   out=val("n")==="30"?(val("alpha")==="0.01"?"0.463":"0.361"):"Reference-table lookup required for this n and α.";
   formula="r = [nΣxy−ΣxΣy]/√([nΣx²−(Σx)²][nΣy²−(Σy)²])"; comment="Critical correlation depends on n and significance level.";
 }else if(k==="spearman"){
   out=val("n")==="30"?(val("alpha")==="0.01"?"0.478":"0.364"):"Reference-table lookup required for this n and α.";
   formula="rₛ = 1 − 6Σd²/[n(n²−1)]"; comment="Critical Spearman rank correlation depends on n and α.";
 }else if(k==="samplesize"){
   const z=val("confidence")==="0.99"?2.576:val("confidence")==="0.90"?1.645:1.96;
   out=Math.ceil(z*z*.25/(+val("e")**2)); formula="n = z²pq/e² (using p=q=0.5)"; comment="For maximum required sample size, p=q=0.5 is used.";
 }else if(k==="log"){
   out=Math.log10(+val("x")).toFixed(4); formula="log₁₀(x)"; comment="Common logarithm, rounded to four decimal places.";
 }else if(k==="random"){
   out=Array.from({length:Math.min(100,+val("count"))},()=>String(Math.floor(Math.random()*100)).padStart(2,"0")).join("  ");
   formula="Random-number generation"; comment="Random values are generated in the browser.";
 }else{
   out="Reference-table lookup required for this combination.";
   formula="See the selected statistical table."; comment="Enter the required inputs and use the corresponding reference table.";
 }
 document.getElementById("stResult").innerHTML='<div class="st-result"><div class="st-note">Requested value</div><div class="st-value">'+out+'</div><div class="st-note">'+sel.options[sel.selectedIndex].text+'</div><div class="st-formula"><b>Formula / Rule:</b> '+formula+'<br><b>Comment:</b> '+comment+'</div></div>';
}
renderInputs();
</script>
</body></html>
