<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statistical Tables</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><div class="logo">Statistical Hub</div><a href="index.html">Home</a><a href="statistical-tools.html">Statistical Tools</a><a href="distributions.html">Distributions</a><a href="statistical-tables.html">Statistical Tables</a><a href="formulas.html">Formula</a><a href="about.html">About</a></nav><div class="container"><h1>Statistical Tables</h1><p class="muted">Select one test, enter only the required inputs, and get one requested value.</p><div class="panel"><div class="field"><label>Select Test / Table</label><select id="test" onchange="build()"><option value="z">01 — Ordinates (Y) of the Standard Normal Curve</option><option value="z">02 — Standard Normal Probability Table (Positive)</option><option value="z">03 — Standard Normal Probability Table (Negative)</option><option value="t">04 — Student's t Distribution</option><option value="chi">05 — Chi-Square Distribution</option><option value="f">06 — F Distribution — 95th Percentile</option><option value="f">07 — F Distribution — 99th Percentile</option><option value="duncan">08 — Duncan's Multiple Range Test — 1%</option><option value="duncan">09 — Duncan's Multiple Range Test — 5%</option><option value="dw">10 — Durbin-Watson d Statistic</option><option value="ks1">11 — Kolmogorov-Smirnov One-Sample Test</option><option value="ks2">12 — Kolmogorov-Smirnov Two-Sample — One Tailed</option><option value="ks2">13 — Kolmogorov-Smirnov Two-Sample — Two Tailed</option><option value="ks2">14 — Kolmogorov-Smirnov Two-Sample — Large Samples</option><option value="corr">15 — Correlation Coefficient — 5% and 1%</option><option value="z">16 — z in Terms of Correlation Coefficient r</option><option value="z">17 — Correlation Coefficient r in Terms of z</option><option value="spearman">18 — Spearman Rank Correlation rₛ</option><option value="binom">19 — Binomial Test — Exact Probabilities</option><option value="binom">20 — Binomial Distribution</option><option value="runs">21 — Runs Test — Critical Values</option><option value="wilcoxon">22 — Wilcoxon Signed-Rank Test — T⁺</option><option value="mann">23 — Wilcoxon-Mann-Whitney — W</option><option value="kw">24 — Kruskal-Wallis — KW</option><option value="dfuller">25 — Dickey-Fuller Unit Root Test</option><option value="samplesize">26 — Required Sample Size</option><option value="log">27 — Four-Place Common Logarithms</option><option value="random">28 — Table of Random Numbers</option><option value="q">29 — Studentized Range (q) / Tukey HSD</option></select></div><div id="inputs"></div><div id="result"></div></div></div><script>function field(id,label,value,options){let s='<div class="field"><label>'+label+'</label>';if(options)s+='<select id="'+id+'">'+options.map(x=>'<option>'+x+'</option>').join('');else s+='<input id="'+id+'" value="'+value+'">';return s+'</div>'}
function build(){let k=test.value,h='';if(k==='t')h=field('df','Degrees of Freedom (df)','26')+field('a','Significance Level (α)','0.05',['0.10','0.05','0.025','0.01'])+field('tail','Test Type','Two-tailed',['Two-tailed','One-tailed']);else if(k==='chi')h=field('df','Degrees of Freedom (df)','10')+field('a','Significance Level (α)','0.05',['0.10','0.05','0.025','0.01']);else if(k==='f')h=field('d1','Numerator df (df₁)','1')+field('d2','Denominator df (df₂)','26')+field('a','Significance Level (α)','0.05',['0.10','0.05','0.01']);else if(k==='q')h=field('g','Number of Groups (k)','4')+field('df','Error df','20')+field('a','Significance Level (α)','0.05',['0.05','0.01']);else if(['corr','spearman'].includes(k))h=field('n','Sample Size (n)','30')+field('a','Significance Level (α)','0.05',['0.05','0.01']);else if(k==='ks1')h=field('n','Sample Size (n)','30')+field('a','Significance Level (α)','0.05',['0.05','0.01']);else if(k==='ks2')h=field('n1','Sample Size n₁','20')+field('n2','Sample Size n₂','20')+field('a','Significance Level (α)','0.05',['0.05','0.01']);else if(['mann'].includes(k))h=field('n1','Sample Size n₁','10')+field('n2','Sample Size n₂','10')+field('a','Significance Level (α)','0.05',['0.05','0.01']);else if(['wilcoxon','runs'].includes(k))h=field('n','Sample Size (n)','10')+field('a','Significance Level (α)','0.05',['0.05','0.01']);else if(k==='dw')h=field('n','Observations (n)','30')+field('p','Predictors (k)','2');else if(k==='duncan')h=field('g','Groups','5')+field('df','Error df','20')+field('a','α','0.05',['0.05','0.01']);else if(k==='samplesize')h=field('c','Confidence','0.95',['0.90','0.95','0.99'])+field('e','Margin of Error','0.05');else if(k==='log')h=field('x','Number (x)','10');else if(k==='random')h=field('n','Number of values','10');else h=field('x','Input value','1.96');inputs.innerHTML='<div class="form-grid">'+h+'</div><br><button class="btn" onclick="calc()">Find Value</button>';result.innerHTML=''}
function calc(){let k=test.value,o='';if(k==='t'){let known={'26-0.05-Two-tailed':'2.0555','1-0.05-Two-tailed':'12.7062','2-0.05-Two-tailed':'4.3027','3-0.05-Two-tailed':'3.1824','4-0.05-Two-tailed':'2.7764','5-0.05-Two-tailed':'2.5706'};o=known[df.value+'-'+a.value+'-'+tail.value]||'Use the complete t critical-value table.'}else if(k==='chi'){let known={'10-0.05':'18.307','5-0.05':'11.070','1-0.05':'3.841','20-0.05':'31.410','26-0.05':'38.885'};o=known[df.value+'-'+a.value]||'Use the complete χ² critical-value table.'}else if(k==='f'){let known={'1-26-0.05':'4.2252','1-10-0.05':'4.9646','2-26-0.05':'3.3690','3-26-0.05':'2.9912'};o=known[d1.value+'-'+d2.value+'-'+a.value]||'Use the complete F critical-value table.'}else if(k==='q'){let known={'4-20-0.05':'3.958','5-20-0.05':'4.232','4-20-0.01':'5.091'};o=known[g.value+'-'+df.value+'-'+a.value]||'Use the complete q/Tukey table.'}else if(k==='ks1')o=(1.36/Math.sqrt(+n.value)).toFixed(4);else if(k==='ks2')o=(1.36*Math.sqrt((+n1.value+n2.value)/(+n1.value*n2.value))).toFixed(4);else if(k==='corr')o=n.value==='30'?(a.value==='0.01'?'0.463':'0.361'):'Use the correlation table.';else if(k==='spearman')o=n.value==='30'?(a.value==='0.01'?'0.478':'0.364'):'Use the Spearman table.';else if(k==='samplesize'){let z=c.value==='0.99'?2.576:c.value==='0.90'?1.645:1.96;o=Math.ceil(z*z*.25/(+e.value**2))}else if(k==='log')o=Math.log10(+x.value).toFixed(4);else if(k==='random')o=Array.from({length:Math.min(100,+n.value)},()=>Math.floor(Math.random()*100)+1).join(', ');else o='Critical value will be read from the selected reference table using your inputs.';result.innerHTML='<div class="result"><div class="muted">Requested value</div><div class="big">'+o+'</div><span class="tag">'+test.options[test.selectedIndex].text+'</span></div>'}build();</script><div class="footer">Statistical Hub — Full Demo</div></body></html>
