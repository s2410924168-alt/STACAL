<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bivariate Analysis</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><div class="logo">Statistical Hub</div><a href="index.html">Home</a><a href="statistical-tools.html">Statistical Tools</a><a href="distributions.html">Distributions</a><a href="statistical-tables.html">Statistical Tables</a><a href="formulas.html">Formula</a><a href="about.html">About</a></nav><div class="container"><div class="panel"><h1>Bivariate Analysis — Auto Analysis</h1><div class="form-grid"><div class="field"><label>X</label><input id="x" value="2,4,5,7,8,10"></div><div class="field"><label>Y</label><input id="y" value="3,6,7,10,12,14"></div></div><br><button class="btn" onclick="go()">Analyze</button><div id="o"></div></div></div><script>function go(){let x=document.getElementById('x').value.split(',').map(Number),y=document.getElementById('y').value.split(',').map(Number),n=Math.min(x.length,y.length),mx=x.slice(0,n).reduce((a,b)=>a+b,0)/n,my=y.slice(0,n).reduce((a,b)=>a+b,0)/n,A=0,B=0,C=0;for(let i=0;i<n;i++){A+=(x[i]-mx)*(y[i]-my);B+=(x[i]-mx)**2;C+=(y[i]-my)**2}let r=A/Math.sqrt(B*C);document.getElementById('o').innerHTML='<div class="result">Pearson r = <span class="big">'+r.toFixed(5)+'</span><br>R² = '+(r*r).toFixed(5)+'</div>'}go();</script><div class="footer">Statistical Hub — Full Demo</div></body></html>
