<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOE Result</title><link rel="stylesheet" href="style.css"><style>.rwrap{max-width:1100px;margin:auto}.rbox{background:#fff;border:1px solid #e2e7ee;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 4px 16px #0001}.back{display:inline-block;background:#173b6c;color:#fff;padding:10px 15px;border-radius:9px;text-decoration:none}.comment{background:#f4f8fd;border-left:5px solid #173b6c;padding:13px;border-radius:8px;margin:12px 0}.formulaBox{background:#fafafa;border:1px solid #e1e5eb;border-radius:9px;padding:13px;font-family:Georgia,serif}.hiddenInput{display:none}.rbox table{margin-left:auto;margin-right:auto;max-width:1000px}.rbox .result,.rbox .comment,.rbox .formulaBox{max-width:1000px;margin-left:auto;margin-right:auto}</style></head><body>

<main class="page"><div class="container rwrap"><div class="page-title"><div class="tag">BASIC DESIGN OF EXPERIMENT</div><h1 id="title">Answer</h1><p>Complete solution with formula, calculation, comment and interpretation.</p></div><div class="rbox"><a class="back" href="Basic_Design_of_Experiment_FINAL.html">← Back to Available Tests</a><div id="answer" style="margin-top:18px"></div></div></div></main><footer class="footer"><span>Statistical Hub</span><span>Basic Design of Experiment — Result</span></footer>
<textarea id="input" class="hiddenInput"></textarea><div id="result"></div><div id="out" style="display:none"></div>
<script src="script.js"></script><script src="doe-engine.js"></script><script>
const test=sessionStorage.getItem('DOE_TEST')||'q1', data=sessionStorage.getItem('DOE_DATA')||'';document.getElementById('input').value=data;
const titles={q1:'Test Treatment Effect',q1b:'Overall Mean & Treatment Effects',q1c:"Fisher's LSD Pairwise Comparison",q2:'Unequal-Observation One-Way ANOVA',q3:'Mean Difference & 90% Confidence Interval',q4:'CRD + Fisher LSD + DMRT',q5:'Two-Way ANOVA',q6:'RBD ANOVA',q7:'RBD + Missing Value',q8:'Latin Square + Missing Value',q9:'Latin Square ANOVA'};
document.getElementById('title').textContent=titles[test]||'DOE Answer';
function comment(text){return `<div class="comment"><b>Comment:</b> ${text}</div>`}
function customQ1b(){const g=nums(data),c=anovaGroups(g),names=['Coating 1','Coating 2','Coating 3','Coating 4'];let s='<h2>Answer</h2><div class="formulaBox">μ̂ = overall mean = ΣY/N<br>τ̂ᵢ = Ȳᵢ· − Ȳ··</div><table><tr><th>Coating</th><th>Mean</th><th>Treatment Effect</th></tr>';c.means.forEach((m,i)=>s+=`<tr><td>${names[i]}</td><td>${fmt(m)}</td><td>${fmt(m-c.gm)}</td></tr>`);s+=`<tr><th>Overall</th><th>${fmt(c.gm)}</th><th>0</th></tr></table>`;return s+comment('A positive treatment effect means the treatment mean is above the overall mean; a negative value means it is below the overall mean.')+`<h3>Interpretation</h3><p>The estimated overall mean is ${fmt(c.gm)}. The treatment-effect estimates show how far each coating mean lies above or below the overall mean.</p>`}
function customQ1c(){const g=nums(data),c=anovaGroups(g),names=['Coating 1','Coating 2','Coating 3','Coating 4'],tc=tCrit(c.df2,.05);let s='<h2>Answer</h2><div class="formulaBox">LSDᵢⱼ = t<sub>α/2,error df</sub> √[MSE(1/nᵢ + 1/nⱼ)]</div><table><tr><th>Pair</th><th>|Mean Difference|</th><th>LSD</th><th>Decision</th></tr>';for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){let d=Math.abs(c.means[i]-c.means[j]),l=tc*Math.sqrt(c.MSE*(1/c.ns[i]+1/c.ns[j]));s+=`<tr><td>${names[i]} vs ${names[j]}</td><td>${fmt(d)}</td><td>${fmt(l)}</td><td>${d>l?'Significant':'Not Significant'}</td></tr>`}s+='</table>';return s+comment('A pair is significant when the absolute difference between its two means is greater than the corresponding Fisher LSD value.')+'<h3>Interpretation</h3><p>The table identifies which coating pairs have statistically different mean conductivity values at the 5% level.</p>'}
function run(){try{let out='';if(test==='q1b')out=customQ1b();else if(test==='q1c')out=customQ1c();else{if(test==='q1')selected=1;if(test==='q2')selected=2;if(test==='q3')selected=3;if(test==='q4')selected=4;if(test==='q5')selected=5;if(test==='q6')selected=6;if(test==='q7')selected=7;if(test==='q8')selected=8;if(test==='q9')selected=9;solveSelected();out=document.getElementById('out').innerHTML;document.getElementById('result').innerHTML='';}document.getElementById('answer').innerHTML=out+comment('This result is generated from the data entered on the previous page. Your input data are preserved when you return to Available Tests.');}catch(e){document.getElementById('answer').innerHTML='<div class="comment"><b>Data error:</b> '+e.message+'</div>';}}
run();
</script></body></html>
