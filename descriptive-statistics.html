<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descriptive Statistics</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><div class="logo">Statistical Hub</div><a href="index.html">Home</a><a href="statistical-tools.html">Statistical Tools</a><a href="distributions.html">Distributions</a><a href="statistical-tables.html">Statistical Tables</a><a href="formulas.html">Formula</a><a href="about.html">About</a></nav><div class="container"><div class="panel"><h1>Descriptive Statistics</h1><textarea id="d" rows="3" style="width:100%">10,12,14,15,18,20,21,24,25,30</textarea><br><br><button class="btn" onclick="go()">Calculate</button><div id="o"></div></div></div><script>function go(){let a=document.getElementById('d').value.split(',').map(Number).filter(Number.isFinite),n=a.length,m=a.reduce((x,y)=>x+y,0)/n,s=[...a].sort((x,y)=>x-y),med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,v=a.reduce((x,y)=>x+(y-m)**2,0)/(n-1);document.getElementById('o').innerHTML='<div class="result">N = '+n+'<br>Mean = '+m.toFixed(4)+'<br>Median = '+med.toFixed(4)+'<br>Sample SD = '+Math.sqrt(v).toFixed(4)+'</div>'}go();</script><div class="footer">Statistical Hub — Full Demo</div></body></html>
